name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh run.sh
      - name: Validate Python syntax
        run: python3 -m py_compile app/*.py
      - name: Ensure no generated secrets are committed
        run: |
          ! grep -R "CHANGE_ME_AT_INSTALL" .env.example app static README.md
