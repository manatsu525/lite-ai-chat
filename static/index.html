<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite AI Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6c9eff;
      --accent-hover: #8bb3ff;
      --user: #1e3a5f;
      --assistant: #1a1d24;
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #0b1020;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.55rem 1rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--border));
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    /* ---- Login ---- */
    #login-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
    }
    .login-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.35rem;
    }
    .login-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0.6rem 0;
      min-height: 1.2em;
    }
    .login-card button { width: 100%; margin-top: 0.4rem; }

    /* ---- Chat ---- */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .user-meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: center; }
    #model-select {
      width: auto;
      min-width: 190px;
      padding: 0.5rem 2rem 0.5rem 0.7rem;
      color: var(--text);
    }
    .session-bar {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #conversation-select { flex: 1; min-width: 0; }
    .session-bar button { flex-shrink: 0; }
    @media (max-width: 680px) {
      header { align-items: flex-start; gap: 0.6rem; }
      header .user-meta { flex-wrap: wrap; justify-content: flex-end; }
      #who { display: none; }
      #model-select { min-width: 170px; max-width: 205px; }
      .session-bar { padding: 0.45rem 0.65rem; }
      .session-bar button { padding: 0.5rem 0.65rem; }
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: min(780px, 100%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .msg .role {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .msg .content { white-space: normal; }
    .msg .content a { color: var(--accent); }
    .msg .content p { margin: 0.45rem 0; }
    .msg .content p:first-child { margin-top: 0; }
    .msg .content p:last-child { margin-bottom: 0; }
    .msg .content h1, .msg .content h2, .msg .content h3,
    .msg .content h4, .msg .content h5, .msg .content h6 {
      margin: 0.9rem 0 0.45rem;
      line-height: 1.3;
    }
    .msg .content h1 { font-size: 1.4rem; }
    .msg .content h2 { font-size: 1.25rem; }
    .msg .content h3 { font-size: 1.1rem; }
    .msg .content ul, .msg .content ol {
      margin: 0.45rem 0;
      padding-left: 1.5rem;
    }
    .msg .content li { margin: 0.2rem 0; }
    .msg .content blockquote {
      margin: 0.55rem 0;
      padding: 0.25rem 0.8rem;
      color: var(--muted);
      border-left: 3px solid var(--accent);
      background: rgba(108, 158, 255, 0.06);
    }
    .msg .content code {
      padding: 0.12rem 0.3rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
    }
    .msg .content pre {
      margin: 0.6rem 0;
      padding: 0.8rem;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0d11;
    }
    .msg .content pre code {
      padding: 0;
      border: 0;
      background: transparent;
      white-space: pre;
    }
    .table-wrap {
      max-width: 100%;
      margin: 0.65rem 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .msg .content table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .msg .content th, .msg .content td {
      padding: 0.55rem 0.7rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .msg .content th { background: rgba(108, 158, 255, 0.12); }
    .msg .content tr:last-child td { border-bottom: 0; }
    .msg .content th:last-child, .msg .content td:last-child { border-right: 0; }
    .msg .content hr { margin: 0.8rem 0; border: 0; border-top: 1px solid var(--border); }
    .msg.status {
      align-self: center;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
    }
    .composer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.75rem 1rem 1rem;
    }
    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .composer textarea {
      min-height: 48px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
    }
    .composer button { flex-shrink: 0; height: 48px; padding: 0 1.2rem; }
    .hint {
      max-width: 860px;
      margin: 0.4rem auto 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .settings-card {
      width: min(640px, 100%);
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .settings-head h2 { font-size: 1.1rem; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .settings-grid .wide { grid-column: 1 / -1; }
    .settings-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
    }
    .settings-note, .settings-status {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.55rem;
      line-height: 1.5;
    }
    .settings-status.ok { color: var(--ok); }
    .settings-status.bad { color: var(--danger); }
    .model-list {
      margin-top: 0.55rem;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
    }
    .model-option {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .model-option:hover { background: var(--bg); }
    .model-option input { width: auto; margin-top: 0.18rem; }
    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <!-- 登录 / 首次注册 -->
  <div id="login-view">
    <div class="login-card">
      <h1>Lite AI Chat</h1>
      <p class="sub" id="login-sub">登录后长期有效，无需反复输入</p>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="error" id="login-error"></div>
      <button id="auth-btn" type="button">登录</button>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat-view">
    <header>
      <div class="brand">Lite AI Chat</div>
      <div class="user-meta">
        <select id="model-select" aria-label="选择模型" title="选择模型"></select>
        <span id="who"></span>
        <button class="ghost" id="settings-btn" type="button">API / 模型</button>
        <button class="ghost" id="clear-btn" type="button">清空</button>
        <button class="ghost" id="logout-btn" type="button">退出</button>
      </div>
    </header>
    <div class="session-bar">
      <select id="conversation-select" aria-label="最近对话"></select>
      <button class="ghost" id="new-chat-btn" type="button">新对话</button>
      <button class="danger" id="delete-chat-btn" type="button">删除</button>
    </div>
    <div id="messages">
      <div class="empty" id="empty-hint">发送消息开始对话<br />支持网络搜索与网页抓取</div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
        <button class="danger" id="stop-btn" type="button" style="display:none">停止</button>
        <button id="send-btn" type="button">发送</button>
      </div>
      <div class="hint">生成在服务器后台继续，刷新、锁屏或关闭页面后可回来查看 · 后端自动多轮工具调用</div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true">
    <div class="settings-card">
      <div class="settings-head">
        <h2>API 与模型设置</h2>
        <button class="ghost" id="settings-close" type="button">关闭</button>
      </div>
      <div class="settings-grid">
        <div class="field">
          <label for="provider-select">提供商配置</label>
          <select id="provider-select"></select>
        </div>
        <div class="field">
          <label for="provider-id">配置标识</label>
          <input id="provider-id" placeholder="例如 groq" />
        </div>
        <div class="field">
          <label for="provider-label">显示名称</label>
          <input id="provider-label" placeholder="例如 Groq" />
        </div>
        <div class="field">
          <label for="provider-key">API Key</label>
          <input id="provider-key" type="password" autocomplete="off" placeholder="留空则使用已保存密钥" />
        </div>
        <div class="field wide">
          <label for="provider-base">OpenAI 兼容 API 地址</label>
          <input id="provider-base" placeholder="https://api.example.com/v1" />
        </div>
        <div class="field wide">
          <label for="manual-models">手动模型名（可选）</label>
          <textarea id="manual-models" rows="3" placeholder="每行一个或用逗号分隔，例如：provider/new-model"></textarea>
        </div>
      </div>
      <div class="settings-actions">
        <button id="provider-test" type="button">测试 API 并读取模型</button>
      </div>
      <div class="settings-status" id="provider-status"></div>
      <div id="models-panel" style="display:none">
        <div class="field" style="margin-top:0.9rem">
          <label for="model-filter">筛选模型</label>
          <input id="model-filter" placeholder="输入模型名称…" />
        </div>
        <div class="model-list" id="provider-models"></div>
        <div class="settings-actions">
          <button id="provider-save" type="button">保存所选模型</button>
          <button class="danger" id="provider-delete" type="button">删除此 API 配置</button>
        </div>
      </div>
      <p class="settings-note">
        API Key 只写入服务器的受限配置文件，页面不会读取或回显完整密钥。手填模型会通过最小聊天请求直接验证，不要求出现在 /models 中。
      </p>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "lite_ai_token";
    const USER_KEY = "lite_ai_user";
    const MODEL_KEY = "lite_ai_model";
    let history = []; // {role, content}
    let busy = false;
    let isBootstrap = false;
    let providerSettings = [];
    let testedModels = [];
    let savedProviderModels = [];
    let conversations = [];
    let currentConversationId = "";
    let currentJobId = "";
    let jobPollTimer = null;

    const $ = (id) => document.getElementById(id);

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }
    function setAuth(token, username) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || "");
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { ...opts, headers });
      return res;
    }

    async function init() {
      // 检查是否已登录
      if (getToken()) {
        const res = await api("/api/auth/me");
        if (res.ok) {
          const me = await res.json();
          showChat(me.username);
          return;
        }
        clearAuth();
      }
      // 是否首次启动（无用户）
      try {
        const st = await fetch("/api/auth/status").then((r) => r.json());
        isBootstrap = !st.has_users;
        $("login-sub").textContent = isBootstrap
          ? "首次启动：创建管理员账号（之后登录长期有效）"
          : "登录后长期有效，无需反复输入";
        $("auth-btn").textContent = isBootstrap ? "创建账号并登录" : "登录";
      } catch (e) {
        $("login-error").textContent = "无法连接服务器";
      }
      $("login-view").style.display = "flex";
      $("chat-view").style.display = "none";
    }

    async function showChat(username) {
      $("login-view").style.display = "none";
      $("chat-view").style.display = "flex";
      $("who").textContent = username || localStorage.getItem(USER_KEY) || "";
      await Promise.all([loadModels(), loadConversations()]);
      await resumeActiveJob();
    }

    async function loadModels() {
      const select = $("model-select");
      select.disabled = true;
      try {
        const res = await api("/v1/models");
        if (!res.ok) throw new Error("模型列表加载失败");
        const payload = await res.json();
        const models = payload.data || [];
        select.innerHTML = "";
        for (const model of models) {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = model.label || model.id;
          select.appendChild(option);
        }
        const saved = localStorage.getItem(MODEL_KEY);
        const selected = models.some((m) => m.id === saved) ? saved : payload.default;
        select.value = selected || (models[0] && models[0].id) || "";
        if (select.value) localStorage.setItem(MODEL_KEY, select.value);
        if (!models.length) {
          select.innerHTML = '<option value="">请先配置 API</option>';
        }
      } catch (e) {
        select.innerHTML = '<option value="">模型不可用</option>';
      } finally {
        select.disabled = false;
      }
    }

    $("model-select").addEventListener("change", (e) => {
      localStorage.setItem(MODEL_KEY, e.target.value);
    });

    function newConversationId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return "chat-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function currentTitle() {
      const first = history.find((item) => item.role === "user" && item.content.trim());
      return first ? first.content.trim().replace(/\s+/g, " ").slice(0, 32) : "新对话";
    }

    function renderConversationSelect() {
      const select = $("conversation-select");
      select.innerHTML = "";
      for (const item of conversations.slice(0, 10)) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.title || "新对话";
        select.appendChild(option);
      }
      select.value = currentConversationId;
    }

    function renderConversation() {
      $("messages").innerHTML = "";
      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.id = "empty-hint";
        empty.innerHTML = "发送消息开始对话<br />支持网络搜索与网页抓取";
        $("messages").appendChild(empty);
        return;
      }
      for (const item of history) appendMsg(item.role, item.content);
    }

    function createConversation() {
      currentConversationId = newConversationId();
      history = [];
      conversations.unshift({
        id: currentConversationId,
        title: "新对话",
        messages: [],
        updated_at: new Date().toISOString(),
      });
      conversations = conversations.slice(0, 10);
      renderConversationSelect();
      renderConversation();
    }

    async function loadConversations() {
      try {
        const res = await api("/api/conversations");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "对话历史加载失败");
        conversations = data.data || [];
        if (conversations.length) {
          currentConversationId = conversations[0].id;
          history = (conversations[0].messages || []).map((item) => ({
            role: item.role,
            content: item.content || "",
          }));
          renderConversationSelect();
          renderConversation();
        } else {
          createConversation();
        }
      } catch (_) {
        createConversation();
      }
    }

    async function persistConversation() {
      if (!currentConversationId || !history.length) return;
      const title = currentTitle();
      let item = conversations.find((entry) => entry.id === currentConversationId);
      if (!item) {
        item = { id: currentConversationId };
        conversations.unshift(item);
      }
      item.title = title;
      item.messages = history.map((message) => ({
        role: message.role,
        content: message.content,
      }));
      item.updated_at = new Date().toISOString();
      conversations = [item, ...conversations.filter((entry) => entry.id !== item.id)].slice(0, 10);
      renderConversationSelect();
      try {
        await api("/api/conversations/" + encodeURIComponent(currentConversationId), {
          method: "PUT",
          body: JSON.stringify({ title, messages: item.messages }),
        });
      } catch (_) {}
    }

    $("conversation-select").addEventListener("change", (e) => {
      if (busy) {
        e.target.value = currentConversationId;
        return;
      }
      const item = conversations.find((entry) => entry.id === e.target.value);
      if (!item) return;
      currentConversationId = item.id;
      history = (item.messages || []).map((message) => ({
        role: message.role,
        content: message.content || "",
      }));
      renderConversation();
    });

    $("new-chat-btn").onclick = () => {
      if (!busy) createConversation();
    };

    $("delete-chat-btn").onclick = async () => {
      if (busy || !currentConversationId) return;
      if (!confirm("删除当前对话？")) return;
      const deleting = currentConversationId;
      conversations = conversations.filter((item) => item.id !== deleting);
      try {
        await api("/api/conversations/" + encodeURIComponent(deleting), { method: "DELETE" });
      } catch (_) {}
      if (conversations.length) {
        currentConversationId = conversations[0].id;
        history = (conversations[0].messages || []).map((item) => ({
          role: item.role,
          content: item.content || "",
        }));
        renderConversationSelect();
        renderConversation();
      } else {
        createConversation();
      }
    };

    function providerPayload() {
      const manualModels = $("manual-models").value
        .split(/[\n,]+/)
        .map((item) => item.trim())
        .filter(Boolean);
      return {
        provider_id: $("provider-id").value.trim(),
        provider_label: $("provider-label").value.trim(),
        api_base: $("provider-base").value.trim(),
        api_key: $("provider-key").value.trim(),
        selected_models: Array.from(new Set(manualModels)),
      };
    }

    function setProviderStatus(message, kind = "") {
      const el = $("provider-status");
      el.textContent = message;
      el.className = "settings-status " + kind;
    }

    function renderProviderModels(models, selected = []) {
      testedModels = models.slice();
      const selectedSet = new Set(selected);
      const list = $("provider-models");
      list.innerHTML = "";
      for (const model of models) {
        const label = document.createElement("label");
        label.className = "model-option";
        label.dataset.model = model.toLowerCase();
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = model;
        checkbox.checked = selectedSet.has(model);
        const text = document.createElement("span");
        text.textContent = model;
        label.append(checkbox, text);
        list.appendChild(label);
      }
      $("models-panel").style.display = models.length ? "block" : "none";
      $("model-filter").value = "";
    }

    function applyProvider(providerId) {
      const item = providerSettings.find((p) => p.provider_id === providerId);
      if (item) {
        $("provider-id").value = item.provider_id;
        $("provider-label").value = item.provider_label || item.provider_id;
        $("provider-base").value = item.api_base || "";
        $("provider-key").value = "";
        $("manual-models").value = "";
        $("provider-key").placeholder = item.configured
          ? "已保存 " + (item.api_key_masked || "密钥") + "；留空保持不变"
          : "输入 API Key";
        savedProviderModels = (item.models || []).slice();
        renderProviderModels(savedProviderModels, savedProviderModels);
        $("provider-delete").disabled = !item.configured;
        setProviderStatus(
          item.configured
            ? "可取消勾选模型后保存，或删除整个 API 配置；测试可刷新模型列表。"
            : ""
        );
      } else {
        $("provider-id").value = "custom";
        $("provider-label").value = "Custom";
        $("provider-base").value = "";
        $("provider-key").value = "";
        $("manual-models").value = "";
        $("provider-key").placeholder = "输入 API Key";
        savedProviderModels = [];
        renderProviderModels([], []);
        $("provider-delete").disabled = true;
        setProviderStatus("");
      }
    }

    async function openSettings() {
      $("settings-modal").classList.add("open");
      setProviderStatus("正在读取配置…");
      try {
        const res = await api("/api/settings/providers");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "读取配置失败");
        providerSettings = data.providers || [];
        const select = $("provider-select");
        select.innerHTML = "";
        for (const item of providerSettings) {
          const option = document.createElement("option");
          option.value = item.provider_id;
          option.textContent = item.provider_label || item.provider_id;
          select.appendChild(option);
        }
        const custom = document.createElement("option");
        custom.value = "__custom__";
        custom.textContent = "其他 OpenAI 兼容接口";
        select.appendChild(custom);
        applyProvider((providerSettings[0] || {}).provider_id || "__custom__");
      } catch (e) {
        setProviderStatus(e.message, "bad");
      }
    }

    $("settings-btn").onclick = openSettings;
    $("settings-close").onclick = () => {
      $("provider-key").value = "";
      $("manual-models").value = "";
      $("settings-modal").classList.remove("open");
    };
    $("settings-modal").addEventListener("click", (e) => {
      if (e.target === $("settings-modal")) $("settings-close").click();
    });
    $("provider-select").addEventListener("change", (e) => applyProvider(e.target.value));

    $("provider-test").onclick = async () => {
      const body = providerPayload();
      if (!body.provider_id || !body.provider_label || !body.api_base) {
        setProviderStatus("请完整填写配置标识、显示名称和 API 地址。", "bad");
        return;
      }
      $("provider-test").disabled = true;
      setProviderStatus("正在测试 API 并读取模型…");
      try {
        const res = await api("/api/settings/providers/test", {
          method: "POST",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "API 测试失败");
        const selected = Array.from(new Set([
          ...savedProviderModels.filter((m) => data.models.includes(m)),
          ...body.selected_models,
        ]));
        renderProviderModels(data.models || [], selected.length ? selected : data.models.slice(0, 1));
        const manualText = (data.manual_tested || []).length
          ? "，手填模型验证 " + data.manual_tested.length + " 个"
          : "";
        const warning = data.models_warning ? "（/models 不可用，已使用手填模型验证）" : "";
        setProviderStatus(
          "连接成功，得到 " + data.models.length + " 个模型" + manualText + warning + "。请选择后保存。",
          "ok"
        );
      } catch (e) {
        testedModels = [];
        renderProviderModels([], []);
        setProviderStatus(e.message, "bad");
      } finally {
        $("provider-test").disabled = false;
      }
    };

    $("model-filter").addEventListener("input", (e) => {
      const value = e.target.value.trim().toLowerCase();
      for (const item of $("provider-models").children) {
        item.style.display = !value || item.dataset.model.includes(value) ? "flex" : "none";
      }
    });

    $("provider-save").onclick = async () => {
      if (!testedModels.length) {
        setProviderStatus("请先测试 API 并读取模型。", "bad");
        return;
      }
      const body = providerPayload();
      body.selected_models = Array.from(
        $("provider-models").querySelectorAll('input[type="checkbox"]:checked')
      ).map((el) => el.value);
      if (!body.selected_models.length) {
        setProviderStatus("请至少选择一个模型。", "bad");
        return;
      }
      $("provider-save").disabled = true;
      setProviderStatus("正在验证并保存…");
      try {
        const res = await api("/api/settings/providers", {
          method: "POST",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "保存失败");
        $("provider-key").value = "";
        setProviderStatus("保存成功，聊天模型列表已更新。", "ok");
        await loadModels();
        setTimeout(() => $("settings-close").click(), 700);
      } catch (e) {
        setProviderStatus(e.message, "bad");
      } finally {
        $("provider-save").disabled = false;
      }
    };

    $("provider-delete").onclick = async () => {
      const providerId = $("provider-id").value.trim();
      if (!providerId || $("provider-delete").disabled) return;
      if (!confirm("删除此 API 配置及其全部已选模型？")) return;
      $("provider-delete").disabled = true;
      setProviderStatus("正在删除…");
      try {
        const res = await api(
          "/api/settings/providers/" + encodeURIComponent(providerId),
          { method: "DELETE" }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "删除失败");
        localStorage.removeItem(MODEL_KEY);
        await loadModels();
        setProviderStatus("已删除 API 配置和相关模型。", "ok");
        await openSettings();
      } catch (e) {
        setProviderStatus(e.message, "bad");
        $("provider-delete").disabled = false;
      }
    };

    $("auth-btn").onclick = async () => {
      const username = $("username").value.trim();
      const password = $("password").value;
      $("login-error").textContent = "";
      if (!username || !password) {
        $("login-error").textContent = "请输入用户名和密码";
        return;
      }
      const path = isBootstrap ? "/api/auth/register" : "/api/auth/login";
      try {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("login-error").textContent = data.detail || "失败";
          return;
        }
        setAuth(data.token, data.username);
        showChat(data.username);
      } catch (e) {
        $("login-error").textContent = "网络错误";
      }
    };

    $("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("auth-btn").click();
    });

    $("logout-btn").onclick = async () => {
      try { await api("/api/auth/logout", { method: "POST" }); } catch (_) {}
      clearAuth();
      history = [];
      location.reload();
    };

    $("clear-btn").onclick = async () => {
      history = [];
      renderConversation();
      const item = conversations.find((entry) => entry.id === currentConversationId);
      if (item) {
        item.messages = [];
        item.title = "新对话";
        renderConversationSelect();
        try {
          await api("/api/conversations/" + encodeURIComponent(currentConversationId), {
            method: "PUT",
            body: JSON.stringify({ title: "新对话", messages: [] }),
          });
        } catch (_) {}
      }
    };

    function removeEmpty() {
      const el = $("empty-hint");
      if (el) el.remove();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInlineMarkdown(value) {
      const codeTokens = [];
      let text = escapeHtml(value).replace(/`([^`\n]+)`/g, (_, code) => {
        const token = "\u0000CODE" + codeTokens.length + "\u0000";
        codeTokens.push("<code>" + code + "</code>");
        return token;
      });
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
        const decoded = url.replace(/&amp;/g, "&");
        if (!/^https?:\/\//i.test(decoded)) return label + " (" + url + ")";
        return '<a href="' + escapeHtml(decoded) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
      });
      text = text
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      return text.replace(/\u0000CODE(\d+)\u0000/g, (_, index) => codeTokens[Number(index)] || "");
    }

    function splitTableRow(line) {
      let value = line.trim();
      if (value.startsWith("|")) value = value.slice(1);
      if (value.endsWith("|")) value = value.slice(0, -1);
      return value.split("|").map((cell) => cell.trim());
    }

    function isTableDivider(line) {
      const cells = splitTableRow(line);
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      const out = [];
      let paragraph = [];
      let listType = "";

      const flushParagraph = () => {
        if (!paragraph.length) return;
        out.push("<p>" + paragraph.map(renderInlineMarkdown).join("<br>") + "</p>");
        paragraph = [];
      };
      const closeList = () => {
        if (listType) out.push("</" + listType + ">");
        listType = "";
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (/^```/.test(trimmed)) {
          flushParagraph();
          closeList();
          const language = trimmed.slice(3).trim();
          const code = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            code.push(lines[i]);
            i++;
          }
          const languageClass = language
            ? ' class="language-' + escapeHtml(language.replace(/[^a-zA-Z0-9_-]/g, "")) + '"'
            : "";
          out.push("<pre><code" + languageClass + ">" + escapeHtml(code.join("\n")) + "</code></pre>");
          continue;
        }

        if (
          line.includes("|") &&
          i + 1 < lines.length &&
          isTableDivider(lines[i + 1])
        ) {
          flushParagraph();
          closeList();
          const headers = splitTableRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
            rows.push(splitTableRow(lines[i]));
            i++;
          }
          i--;
          let table = '<div class="table-wrap"><table><thead><tr>';
          table += headers.map((cell) => "<th>" + renderInlineMarkdown(cell) + "</th>").join("");
          table += "</tr></thead><tbody>";
          for (const row of rows) {
            table += "<tr>" + headers.map((_, index) =>
              "<td>" + renderInlineMarkdown(row[index] || "") + "</td>"
            ).join("") + "</tr>";
          }
          table += "</tbody></table></div>";
          out.push(table);
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          out.push("<h" + level + ">" + renderInlineMarkdown(heading[2]) + "</h" + level + ">");
          continue;
        }
        if (/^([-*_])(?:\s*\1){2,}$/.test(trimmed)) {
          flushParagraph();
          closeList();
          out.push("<hr>");
          continue;
        }
        if (trimmed.startsWith("> ")) {
          flushParagraph();
          closeList();
          out.push("<blockquote>" + renderInlineMarkdown(trimmed.slice(2)) + "</blockquote>");
          continue;
        }

        const unordered = trimmed.match(/^[-*+]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const nextType = unordered ? "ul" : "ol";
          if (listType !== nextType) {
            closeList();
            listType = nextType;
            out.push("<" + listType + ">");
          }
          out.push("<li>" + renderInlineMarkdown((unordered || ordered)[1]) + "</li>");
          continue;
        }

        closeList();
        paragraph.push(line);
      }
      flushParagraph();
      closeList();
      return out.join("");
    }

    function setAssistantContent(element, content) {
      element.innerHTML = renderMarkdown(content);
    }

    function appendMsg(role, content, isStatus) {
      removeEmpty();
      const div = document.createElement("div");
      div.className = "msg " + (isStatus ? "status" : role);
      if (!isStatus) {
        const r = document.createElement("div");
        r.className = "role";
        r.textContent = role === "user" ? "你" : "助手";
        div.appendChild(r);
      }
      const c = document.createElement("div");
      c.className = "content";
      if (!isStatus && role === "assistant") setAssistantContent(c, content);
      else c.textContent = content;
      div.appendChild(c);
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return c;
    }

    function autoResize() {
      const ta = $("input");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }
    $("input").addEventListener("input", autoResize);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    $("send-btn").onclick = send;
    $("stop-btn").onclick = stopGeneration;

    function setBusyState(value) {
      busy = value;
      $("send-btn").disabled = value;
      $("model-select").disabled = value;
      $("conversation-select").disabled = value;
      $("new-chat-btn").disabled = value;
      $("delete-chat-btn").disabled = value;
      $("clear-btn").disabled = value;
      $("settings-btn").disabled = value;
      $("stop-btn").style.display = value ? "" : "none";
      $("stop-btn").disabled = false;
    }

    function clearJobPoll() {
      if (jobPollTimer) clearTimeout(jobPollTimer);
      jobPollTimer = null;
    }

    function showJobInConversation(job) {
      const item = conversations.find((entry) => entry.id === job.conversation_id);
      if (item) {
        currentConversationId = item.id;
        history = (item.messages || []).map((message) => ({
          role: message.role,
          content: message.content || "",
        }));
        renderConversationSelect();
        renderConversation();
      }
      const contentEl = appendMsg("assistant", job.content || "思考中…");
      const statusEl = appendMsg(
        "status",
        job.status_message || "后台生成中…",
        true,
      );
      return { contentEl, statusEl };
    }

    async function resumeActiveJob() {
      try {
        const res = await api("/api/chat/jobs/active");
        if (!res.ok) return;
        const payload = await res.json();
        if (!payload.job) {
          // 避免任务恰好在首次加载历史后完成而漏掉最后一条回答。
          await loadConversations();
          return;
        }
        currentJobId = payload.job.id;
        setBusyState(true);
        const ui = showJobInConversation(payload.job);
        pollJob(payload.job.id, ui.contentEl, ui.statusEl, true);
      } catch (_) {}
    }

    async function pollJob(jobId, contentEl, statusEl, immediate = false) {
      clearJobPoll();
      const poll = async () => {
        if (currentJobId !== jobId) return;
        try {
          const res = await api("/api/chat/jobs/" + encodeURIComponent(jobId));
          if (res.status === 401) {
            clearAuth();
            location.reload();
            return;
          }
          if (!res.ok) throw new Error("任务状态读取失败");
          const job = await res.json();
          setAssistantContent(contentEl, job.content || "思考中…");
          const active = ["queued", "running", "stopping"].includes(job.status);
          if (active) {
            statusEl.textContent = job.status_message || (
              job.status === "stopping" ? "正在停止…" : "后台生成中…"
            );
            jobPollTimer = setTimeout(poll, 900);
            return;
          }
          const statusRow = statusEl.closest(".msg");
          if (statusRow) statusRow.remove();
          currentJobId = "";
          clearJobPoll();
          setBusyState(false);
          await loadConversations();
          $("input").focus();
        } catch (_) {
          // 页面离线或锁屏时不影响服务器任务；恢复联网后继续查询。
          if (currentJobId === jobId) jobPollTimer = setTimeout(poll, 1800);
        }
      };
      jobPollTimer = setTimeout(poll, immediate ? 0 : 700);
    }

    async function stopGeneration() {
      if (!currentJobId) return;
      $("stop-btn").disabled = true;
      try {
        await api(
          "/api/chat/jobs/" + encodeURIComponent(currentJobId) + "/stop",
          { method: "POST" },
        );
      } catch (_) {
        $("stop-btn").disabled = false;
      }
    }

    async function send() {
      if (busy) return;
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      autoResize();

      history.push({ role: "user", content: text });
      appendMsg("user", text);
      setBusyState(true);
      await persistConversation();

      const contentEl = appendMsg("assistant", "思考中…");
      const statusEl = appendMsg("status", "正在提交后台任务…", true);
      try {
        const res = await api("/api/chat/jobs", {
          method: "POST",
          body: JSON.stringify({
            model: $("model-select").value || null,
            messages: history.map((m) => ({ role: m.role, content: m.content })),
            conversation_id: currentConversationId,
            title: currentTitle(),
          }),
        });
        if (res.status === 401) {
          clearAuth();
          location.reload();
          return;
        }
        const job = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(job.detail || "后台任务提交失败");
        currentJobId = job.id;
        statusEl.textContent = job.status_message || "后台生成中…";
        pollJob(job.id, contentEl, statusEl, true);
      } catch (e) {
        const row = statusEl.closest(".msg");
        if (row) row.remove();
        setAssistantContent(contentEl, "请求失败：" + e.message);
        setBusyState(false);
      }
    }

    init();
  </script>
</body>
</html>
