<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite AI Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6c9eff;
      --accent-hover: #8bb3ff;
      --user: #1e3a5f;
      --assistant: #1a1d24;
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #0b1020;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.55rem 1rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--border));
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    /* ---- Login ---- */
    #login-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
    }
    .login-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.35rem;
    }
    .login-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0.6rem 0;
      min-height: 1.2em;
    }
    .login-card button { width: 100%; margin-top: 0.4rem; }

    /* ---- Chat ---- */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .user-meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: center; }
    #model-select {
      width: auto;
      min-width: 190px;
      padding: 0.5rem 2rem 0.5rem 0.7rem;
      color: var(--text);
    }
    .session-bar {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #conversation-select { flex: 1; min-width: 0; }
    .session-bar button { flex-shrink: 0; }
    @media (max-width: 680px) {
      header { align-items: flex-start; gap: 0.6rem; }
      header .user-meta { flex-wrap: wrap; justify-content: flex-end; }
      #who { display: none; }
      #model-select { min-width: 170px; max-width: 205px; }
      .session-bar { padding: 0.45rem 0.65rem; }
      .session-bar button { padding: 0.5rem 0.65rem; }
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: min(780px, 100%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .msg .role {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .msg .content a { color: var(--accent); }
    .msg.status {
      align-self: center;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
    }
    .composer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.75rem 1rem 1rem;
    }
    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .composer textarea {
      min-height: 48px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
    }
    .composer button { flex-shrink: 0; height: 48px; padding: 0 1.2rem; }
    .hint {
      max-width: 860px;
      margin: 0.4rem auto 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .settings-card {
      width: min(640px, 100%);
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .settings-head h2 { font-size: 1.1rem; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .settings-grid .wide { grid-column: 1 / -1; }
    .settings-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
    }
    .settings-note, .settings-status {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.55rem;
      line-height: 1.5;
    }
    .settings-status.ok { color: var(--ok); }
    .settings-status.bad { color: var(--danger); }
    .model-list {
      margin-top: 0.55rem;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
    }
    .model-option {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .model-option:hover { background: var(--bg); }
    .model-option input { width: auto; margin-top: 0.18rem; }
    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <!-- 登录 / 首次注册 -->
  <div id="login-view">
    <div class="login-card">
      <h1>Lite AI Chat</h1>
      <p class="sub" id="login-sub">登录后长期有效，无需反复输入</p>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="error" id="login-error"></div>
      <button id="auth-btn" type="button">登录</button>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat-view">
    <header>
      <div class="brand">Lite AI Chat</div>
      <div class="user-meta">
        <select id="model-select" aria-label="选择模型" title="选择模型"></select>
        <span id="who"></span>
        <button class="ghost" id="settings-btn" type="button">API / 模型</button>
        <button class="ghost" id="clear-btn" type="button">清空</button>
        <button class="ghost" id="logout-btn" type="button">退出</button>
      </div>
    </header>
    <div class="session-bar">
      <select id="conversation-select" aria-label="最近对话"></select>
      <button class="ghost" id="new-chat-btn" type="button">新对话</button>
      <button class="danger" id="delete-chat-btn" type="button">删除</button>
    </div>
    <div id="messages">
      <div class="empty" id="empty-hint">发送消息开始对话<br />支持网络搜索与网页抓取</div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
        <button id="send-btn" type="button">发送</button>
      </div>
      <div class="hint">登录 Token 保存在本地，默认 60 天有效 · 后端自动多轮工具调用</div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true">
    <div class="settings-card">
      <div class="settings-head">
        <h2>API 与模型设置</h2>
        <button class="ghost" id="settings-close" type="button">关闭</button>
      </div>
      <div class="settings-grid">
        <div class="field">
          <label for="provider-select">提供商配置</label>
          <select id="provider-select"></select>
        </div>
        <div class="field">
          <label for="provider-id">配置标识</label>
          <input id="provider-id" placeholder="例如 groq" />
        </div>
        <div class="field">
          <label for="provider-label">显示名称</label>
          <input id="provider-label" placeholder="例如 Groq" />
        </div>
        <div class="field">
          <label for="provider-key">API Key</label>
          <input id="provider-key" type="password" autocomplete="off" placeholder="留空则使用已保存密钥" />
        </div>
        <div class="field wide">
          <label for="provider-base">OpenAI 兼容 API 地址</label>
          <input id="provider-base" placeholder="https://api.example.com/v1" />
        </div>
      </div>
      <div class="settings-actions">
        <button id="provider-test" type="button">测试 API 并读取模型</button>
      </div>
      <div class="settings-status" id="provider-status"></div>
      <div id="models-panel" style="display:none">
        <div class="field" style="margin-top:0.9rem">
          <label for="model-filter">筛选模型</label>
          <input id="model-filter" placeholder="输入模型名称…" />
        </div>
        <div class="model-list" id="provider-models"></div>
        <div class="settings-actions">
          <button id="provider-save" type="button">保存所选模型</button>
          <button class="danger" id="provider-delete" type="button">删除此 API 配置</button>
        </div>
      </div>
      <p class="settings-note">
        API Key 只写入服务器的受限配置文件，页面不会读取或回显完整密钥。保存前会再次验证 API 和模型列表。
      </p>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "lite_ai_token";
    const USER_KEY = "lite_ai_user";
    const MODEL_KEY = "lite_ai_model";
    let history = []; // {role, content}
    let busy = false;
    let isBootstrap = false;
    let providerSettings = [];
    let testedModels = [];
    let savedProviderModels = [];
    let conversations = [];
    let currentConversationId = "";

    const $ = (id) => document.getElementById(id);

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }
    function setAuth(token, username) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || "");
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { ...opts, headers });
      return res;
    }

    async function init() {
      // 检查是否已登录
      if (getToken()) {
        const res = await api("/api/auth/me");
        if (res.ok) {
          const me = await res.json();
          showChat(me.username);
          return;
        }
        clearAuth();
      }
      // 是否首次启动（无用户）
      try {
        const st = await fetch("/api/auth/status").then((r) => r.json());
        isBootstrap = !st.has_users;
        $("login-sub").textContent = isBootstrap
          ? "首次启动：创建管理员账号（之后登录长期有效）"
          : "登录后长期有效，无需反复输入";
        $("auth-btn").textContent = isBootstrap ? "创建账号并登录" : "登录";
      } catch (e) {
        $("login-error").textContent = "无法连接服务器";
      }
      $("login-view").style.display = "flex";
      $("chat-view").style.display = "none";
    }

    function showChat(username) {
      $("login-view").style.display = "none";
      $("chat-view").style.display = "flex";
      $("who").textContent = username || localStorage.getItem(USER_KEY) || "";
      loadModels();
      loadConversations();
    }

    async function loadModels() {
      const select = $("model-select");
      select.disabled = true;
      try {
        const res = await api("/v1/models");
        if (!res.ok) throw new Error("模型列表加载失败");
        const payload = await res.json();
        const models = payload.data || [];
        select.innerHTML = "";
        for (const model of models) {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = model.label || model.id;
          select.appendChild(option);
        }
        const saved = localStorage.getItem(MODEL_KEY);
        const selected = models.some((m) => m.id === saved) ? saved : payload.default;
        select.value = selected || (models[0] && models[0].id) || "";
        if (select.value) localStorage.setItem(MODEL_KEY, select.value);
        if (!models.length) {
          select.innerHTML = '<option value="">请先配置 API</option>';
        }
      } catch (e) {
        select.innerHTML = '<option value="">模型不可用</option>';
      } finally {
        select.disabled = false;
      }
    }

    $("model-select").addEventListener("change", (e) => {
      localStorage.setItem(MODEL_KEY, e.target.value);
    });

    function newConversationId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return "chat-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function currentTitle() {
      const first = history.find((item) => item.role === "user" && item.content.trim());
      return first ? first.content.trim().replace(/\s+/g, " ").slice(0, 32) : "新对话";
    }

    function renderConversationSelect() {
      const select = $("conversation-select");
      select.innerHTML = "";
      for (const item of conversations.slice(0, 10)) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.title || "新对话";
        select.appendChild(option);
      }
      select.value = currentConversationId;
    }

    function renderConversation() {
      $("messages").innerHTML = "";
      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.id = "empty-hint";
        empty.innerHTML = "发送消息开始对话<br />支持网络搜索与网页抓取";
        $("messages").appendChild(empty);
        return;
      }
      for (const item of history) appendMsg(item.role, item.content);
    }

    function createConversation() {
      currentConversationId = newConversationId();
      history = [];
      conversations.unshift({
        id: currentConversationId,
        title: "新对话",
        messages: [],
        updated_at: new Date().toISOString(),
      });
      conversations = conversations.slice(0, 10);
      renderConversationSelect();
      renderConversation();
    }

    async function loadConversations() {
      try {
        const res = await api("/api/conversations");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "对话历史加载失败");
        conversations = data.data || [];
        if (conversations.length) {
          currentConversationId = conversations[0].id;
          history = (conversations[0].messages || []).map((item) => ({
            role: item.role,
            content: item.content || "",
          }));
          renderConversationSelect();
          renderConversation();
        } else {
          createConversation();
        }
      } catch (_) {
        createConversation();
      }
    }

    async function persistConversation() {
      if (!currentConversationId || !history.length) return;
      const title = currentTitle();
      let item = conversations.find((entry) => entry.id === currentConversationId);
      if (!item) {
        item = { id: currentConversationId };
        conversations.unshift(item);
      }
      item.title = title;
      item.messages = history.map((message) => ({
        role: message.role,
        content: message.content,
      }));
      item.updated_at = new Date().toISOString();
      conversations = [item, ...conversations.filter((entry) => entry.id !== item.id)].slice(0, 10);
      renderConversationSelect();
      try {
        await api("/api/conversations/" + encodeURIComponent(currentConversationId), {
          method: "PUT",
          body: JSON.stringify({ title, messages: item.messages }),
        });
      } catch (_) {}
    }

    $("conversation-select").addEventListener("change", (e) => {
      if (busy) {
        e.target.value = currentConversationId;
        return;
      }
      const item = conversations.find((entry) => entry.id === e.target.value);
      if (!item) return;
      currentConversationId = item.id;
      history = (item.messages || []).map((message) => ({
        role: message.role,
        content: message.content || "",
      }));
      renderConversation();
    });

    $("new-chat-btn").onclick = () => {
      if (!busy) createConversation();
    };

    $("delete-chat-btn").onclick = async () => {
      if (busy || !currentConversationId) return;
      if (!confirm("删除当前对话？")) return;
      const deleting = currentConversationId;
      conversations = conversations.filter((item) => item.id !== deleting);
      try {
        await api("/api/conversations/" + encodeURIComponent(deleting), { method: "DELETE" });
      } catch (_) {}
      if (conversations.length) {
        currentConversationId = conversations[0].id;
        history = (conversations[0].messages || []).map((item) => ({
          role: item.role,
          content: item.content || "",
        }));
        renderConversationSelect();
        renderConversation();
      } else {
        createConversation();
      }
    };

    function providerPayload() {
      return {
        provider_id: $("provider-id").value.trim(),
        provider_label: $("provider-label").value.trim(),
        api_base: $("provider-base").value.trim(),
        api_key: $("provider-key").value.trim(),
        selected_models: [],
      };
    }

    function setProviderStatus(message, kind = "") {
      const el = $("provider-status");
      el.textContent = message;
      el.className = "settings-status " + kind;
    }

    function renderProviderModels(models, selected = []) {
      testedModels = models.slice();
      const selectedSet = new Set(selected);
      const list = $("provider-models");
      list.innerHTML = "";
      for (const model of models) {
        const label = document.createElement("label");
        label.className = "model-option";
        label.dataset.model = model.toLowerCase();
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = model;
        checkbox.checked = selectedSet.has(model);
        const text = document.createElement("span");
        text.textContent = model;
        label.append(checkbox, text);
        list.appendChild(label);
      }
      $("models-panel").style.display = models.length ? "block" : "none";
      $("model-filter").value = "";
    }

    function applyProvider(providerId) {
      const item = providerSettings.find((p) => p.provider_id === providerId);
      if (item) {
        $("provider-id").value = item.provider_id;
        $("provider-label").value = item.provider_label || item.provider_id;
        $("provider-base").value = item.api_base || "";
        $("provider-key").value = "";
        $("provider-key").placeholder = item.configured
          ? "已保存 " + (item.api_key_masked || "密钥") + "；留空保持不变"
          : "输入 API Key";
        savedProviderModels = (item.models || []).slice();
        renderProviderModels(savedProviderModels, savedProviderModels);
        $("provider-delete").disabled = !item.configured;
        setProviderStatus(
          item.configured
            ? "可取消勾选模型后保存，或删除整个 API 配置；测试可刷新模型列表。"
            : ""
        );
      } else {
        $("provider-id").value = "custom";
        $("provider-label").value = "Custom";
        $("provider-base").value = "";
        $("provider-key").value = "";
        $("provider-key").placeholder = "输入 API Key";
        savedProviderModels = [];
        renderProviderModels([], []);
        $("provider-delete").disabled = true;
        setProviderStatus("");
      }
    }

    async function openSettings() {
      $("settings-modal").classList.add("open");
      setProviderStatus("正在读取配置…");
      try {
        const res = await api("/api/settings/providers");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "读取配置失败");
        providerSettings = data.providers || [];
        const select = $("provider-select");
        select.innerHTML = "";
        for (const item of providerSettings) {
          const option = document.createElement("option");
          option.value = item.provider_id;
          option.textContent = item.provider_label || item.provider_id;
          select.appendChild(option);
        }
        const custom = document.createElement("option");
        custom.value = "__custom__";
        custom.textContent = "其他 OpenAI 兼容接口";
        select.appendChild(custom);
        applyProvider((providerSettings[0] || {}).provider_id || "__custom__");
      } catch (e) {
        setProviderStatus(e.message, "bad");
      }
    }

    $("settings-btn").onclick = openSettings;
    $("settings-close").onclick = () => {
      $("provider-key").value = "";
      $("settings-modal").classList.remove("open");
    };
    $("settings-modal").addEventListener("click", (e) => {
      if (e.target === $("settings-modal")) $("settings-close").click();
    });
    $("provider-select").addEventListener("change", (e) => applyProvider(e.target.value));

    $("provider-test").onclick = async () => {
      const body = providerPayload();
      if (!body.provider_id || !body.provider_label || !body.api_base) {
        setProviderStatus("请完整填写配置标识、显示名称和 API 地址。", "bad");
        return;
      }
      $("provider-test").disabled = true;
      setProviderStatus("正在测试 API 并读取模型…");
      try {
        const res = await api("/api/settings/providers/test", {
          method: "POST",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "API 测试失败");
        const selected = savedProviderModels.filter((m) => data.models.includes(m));
        renderProviderModels(data.models || [], selected.length ? selected : data.models.slice(0, 1));
        setProviderStatus("连接成功，读取到 " + data.models.length + " 个模型。请选择后保存。", "ok");
      } catch (e) {
        testedModels = [];
        renderProviderModels([], []);
        setProviderStatus(e.message, "bad");
      } finally {
        $("provider-test").disabled = false;
      }
    };

    $("model-filter").addEventListener("input", (e) => {
      const value = e.target.value.trim().toLowerCase();
      for (const item of $("provider-models").children) {
        item.style.display = !value || item.dataset.model.includes(value) ? "flex" : "none";
      }
    });

    $("provider-save").onclick = async () => {
      if (!testedModels.length) {
        setProviderStatus("请先测试 API 并读取模型。", "bad");
        return;
      }
      const body = providerPayload();
      body.selected_models = Array.from(
        $("provider-models").querySelectorAll('input[type="checkbox"]:checked')
      ).map((el) => el.value);
      if (!body.selected_models.length) {
        setProviderStatus("请至少选择一个模型。", "bad");
        return;
      }
      $("provider-save").disabled = true;
      setProviderStatus("正在验证并保存…");
      try {
        const res = await api("/api/settings/providers", {
          method: "POST",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "保存失败");
        $("provider-key").value = "";
        setProviderStatus("保存成功，聊天模型列表已更新。", "ok");
        await loadModels();
        setTimeout(() => $("settings-close").click(), 700);
      } catch (e) {
        setProviderStatus(e.message, "bad");
      } finally {
        $("provider-save").disabled = false;
      }
    };

    $("provider-delete").onclick = async () => {
      const providerId = $("provider-id").value.trim();
      if (!providerId || $("provider-delete").disabled) return;
      if (!confirm("删除此 API 配置及其全部已选模型？")) return;
      $("provider-delete").disabled = true;
      setProviderStatus("正在删除…");
      try {
        const res = await api(
          "/api/settings/providers/" + encodeURIComponent(providerId),
          { method: "DELETE" }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "删除失败");
        localStorage.removeItem(MODEL_KEY);
        await loadModels();
        setProviderStatus("已删除 API 配置和相关模型。", "ok");
        await openSettings();
      } catch (e) {
        setProviderStatus(e.message, "bad");
        $("provider-delete").disabled = false;
      }
    };

    $("auth-btn").onclick = async () => {
      const username = $("username").value.trim();
      const password = $("password").value;
      $("login-error").textContent = "";
      if (!username || !password) {
        $("login-error").textContent = "请输入用户名和密码";
        return;
      }
      const path = isBootstrap ? "/api/auth/register" : "/api/auth/login";
      try {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("login-error").textContent = data.detail || "失败";
          return;
        }
        setAuth(data.token, data.username);
        showChat(data.username);
      } catch (e) {
        $("login-error").textContent = "网络错误";
      }
    };

    $("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("auth-btn").click();
    });

    $("logout-btn").onclick = async () => {
      try { await api("/api/auth/logout", { method: "POST" }); } catch (_) {}
      clearAuth();
      history = [];
      location.reload();
    };

    $("clear-btn").onclick = async () => {
      history = [];
      renderConversation();
      const item = conversations.find((entry) => entry.id === currentConversationId);
      if (item) {
        item.messages = [];
        item.title = "新对话";
        renderConversationSelect();
        try {
          await api("/api/conversations/" + encodeURIComponent(currentConversationId), {
            method: "PUT",
            body: JSON.stringify({ title: "新对话", messages: [] }),
          });
        } catch (_) {}
      }
    };

    function removeEmpty() {
      const el = $("empty-hint");
      if (el) el.remove();
    }

    function appendMsg(role, content, isStatus) {
      removeEmpty();
      const div = document.createElement("div");
      div.className = "msg " + (isStatus ? "status" : role);
      if (!isStatus) {
        const r = document.createElement("div");
        r.className = "role";
        r.textContent = role === "user" ? "你" : "助手";
        div.appendChild(r);
      }
      const c = document.createElement("div");
      c.className = "content";
      c.textContent = content;
      div.appendChild(c);
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return c;
    }

    function autoResize() {
      const ta = $("input");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }
    $("input").addEventListener("input", autoResize);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    $("send-btn").onclick = send;

    async function send() {
      if (busy) return;
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      autoResize();

      history.push({ role: "user", content: text });
      appendMsg("user", text);
      busy = true;
      $("send-btn").disabled = true;
      $("model-select").disabled = true;
      await persistConversation();

      const contentEl = appendMsg("assistant", "思考中…");
      let full = "";
      let statusEl = null;
      let gotContent = false;
      const controller = new AbortController();
      const selectedModel = $("model-select").value || "";
      const requestTimeout = selectedModel.startsWith("deepseek::") ? 180000 : 120000;
      const requestTimer = setTimeout(() => controller.abort(), requestTimeout);
      const clearStatus = () => {
        if (statusEl) {
          const row = statusEl.closest(".msg");
          if (row) row.remove();
          statusEl = null;
        }
      };

      try {
        const res = await api("/v1/chat/completions", {
          method: "POST",
          signal: controller.signal,
          body: JSON.stringify({
            model: selectedModel || null,
            messages: history.map((m) => ({ role: m.role, content: m.content })),
            stream: true,
          }),
        });

        if (res.status === 401) {
          contentEl.textContent = "登录已失效，请重新登录";
          clearAuth();
          setTimeout(() => location.reload(), 1200);
          return;
        }
        if (!res.ok) {
          const err = await res.text();
          contentEl.textContent = "请求失败: " + err.slice(0, 400);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n");
          buf = parts.pop() || "";
          for (const line of parts) {
            const t = line.trim();
            if (!t.startsWith("data:")) continue;
            const payload = t.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const obj = JSON.parse(payload);
              if (obj.status) {
                const s = obj.status;
                let label = s.message || "";
                if (s.type === "thinking") label = "💭 思考中…";
                else if (s.type === "tool_start")
                  label = "🔧 调用工具: " + (s.tools || []).join(", ") + " (第 " + s.round + " 轮)";
                else if (s.type === "tool_running")
                  label = "⏳ 执行中: " + (s.tools || []).join(", ") + "…";
                else if (s.type === "tool_done")
                  label = "✓ 工具完成: " + (s.tools || []).join(", ");
                else if (!label) label = JSON.stringify(s);
                if (statusEl) statusEl.textContent = label;
                else statusEl = appendMsg("status", label, true);
                if (!gotContent) contentEl.textContent = "…";
                continue;
              }
              const delta = (((obj.choices || [])[0] || {}).delta) || {};
              if (delta.content) {
                clearStatus();
                if (!gotContent) {
                  full = "";
                  gotContent = true;
                }
                full += delta.content;
                contentEl.textContent = full;
                $("messages").scrollTop = $("messages").scrollHeight;
              }
            } catch (_) {}
          }
        }

        clearStatus();
        if (!gotContent) full = contentEl.textContent || "(无内容)";
        if (full === "思考中…" || full === "…") full = "(无内容)";
        contentEl.textContent = full;
        history.push({ role: "assistant", content: full });
        await persistConversation();
      } catch (e) {
        clearStatus();
        if (e.name === "AbortError") {
          contentEl.textContent = gotContent
            ? full + "\n\n[请求超时，连接已停止]"
            : "请求等待过久，已自动停止，请重试。";
        } else {
          contentEl.textContent = "网络错误: " + e.message;
        }
      } finally {
        clearStatus();
        clearTimeout(requestTimer);
        busy = false;
        $("send-btn").disabled = false;
        $("model-select").disabled = false;
        $("input").focus();
      }
    }

    init();
  </script>
</body>
</html>
