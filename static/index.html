<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite AI Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6c9eff;
      --accent-hover: #8bb3ff;
      --user: #1e3a5f;
      --assistant: #1a1d24;
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #0b1020;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.55rem 1rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    /* ---- Login ---- */
    #login-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
    }
    .login-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.35rem;
    }
    .login-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0.6rem 0;
      min-height: 1.2em;
    }
    .login-card button { width: 100%; margin-top: 0.4rem; }

    /* ---- Chat ---- */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .user-meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: center; }
    #model-select {
      width: auto;
      min-width: 190px;
      padding: 0.5rem 2rem 0.5rem 0.7rem;
      color: var(--text);
    }
    @media (max-width: 680px) {
      header { align-items: flex-start; gap: 0.6rem; }
      header .user-meta { flex-wrap: wrap; justify-content: flex-end; }
      #who { display: none; }
      #model-select { min-width: 170px; max-width: 205px; }
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: min(780px, 100%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .msg .role {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .msg .content a { color: var(--accent); }
    .msg.status {
      align-self: center;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
    }
    .composer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.75rem 1rem 1rem;
    }
    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .composer textarea {
      min-height: 48px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
    }
    .composer button { flex-shrink: 0; height: 48px; padding: 0 1.2rem; }
    .hint {
      max-width: 860px;
      margin: 0.4rem auto 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <!-- 登录 / 首次注册 -->
  <div id="login-view">
    <div class="login-card">
      <h1>Lite AI Chat</h1>
      <p class="sub" id="login-sub">登录后长期有效，无需反复输入</p>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="error" id="login-error"></div>
      <button id="auth-btn" type="button">登录</button>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat-view">
    <header>
      <div class="brand">Lite AI Chat</div>
      <div class="user-meta">
        <select id="model-select" aria-label="选择模型" title="选择模型"></select>
        <span id="who"></span>
        <button class="ghost" id="clear-btn" type="button">清空</button>
        <button class="ghost" id="logout-btn" type="button">退出</button>
      </div>
    </header>
    <div id="messages">
      <div class="empty" id="empty-hint">发送消息开始对话<br />支持网络搜索与网页抓取</div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
        <button id="send-btn" type="button">发送</button>
      </div>
      <div class="hint">登录 Token 保存在本地，默认 60 天有效 · 后端自动多轮工具调用</div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "lite_ai_token";
    const USER_KEY = "lite_ai_user";
    const MODEL_KEY = "lite_ai_model";
    let history = []; // {role, content}
    let busy = false;
    let isBootstrap = false;

    const $ = (id) => document.getElementById(id);

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }
    function setAuth(token, username) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || "");
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { ...opts, headers });
      return res;
    }

    async function init() {
      // 检查是否已登录
      if (getToken()) {
        const res = await api("/api/auth/me");
        if (res.ok) {
          const me = await res.json();
          showChat(me.username);
          return;
        }
        clearAuth();
      }
      // 是否首次启动（无用户）
      try {
        const st = await fetch("/api/auth/status").then((r) => r.json());
        isBootstrap = !st.has_users;
        $("login-sub").textContent = isBootstrap
          ? "首次启动：创建管理员账号（之后登录长期有效）"
          : "登录后长期有效，无需反复输入";
        $("auth-btn").textContent = isBootstrap ? "创建账号并登录" : "登录";
      } catch (e) {
        $("login-error").textContent = "无法连接服务器";
      }
      $("login-view").style.display = "flex";
      $("chat-view").style.display = "none";
    }

    function showChat(username) {
      $("login-view").style.display = "none";
      $("chat-view").style.display = "flex";
      $("who").textContent = username || localStorage.getItem(USER_KEY) || "";
      loadModels();
    }

    async function loadModels() {
      const select = $("model-select");
      select.disabled = true;
      try {
        const res = await api("/v1/models");
        if (!res.ok) throw new Error("模型列表加载失败");
        const payload = await res.json();
        const models = payload.data || [];
        select.innerHTML = "";
        for (const model of models) {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = model.label || model.id;
          select.appendChild(option);
        }
        const saved = localStorage.getItem(MODEL_KEY);
        const selected = models.some((m) => m.id === saved) ? saved : payload.default;
        select.value = selected || (models[0] && models[0].id) || "";
        if (select.value) localStorage.setItem(MODEL_KEY, select.value);
      } catch (e) {
        select.innerHTML = '<option value="">模型不可用</option>';
      } finally {
        select.disabled = false;
      }
    }

    $("model-select").addEventListener("change", (e) => {
      localStorage.setItem(MODEL_KEY, e.target.value);
    });

    $("auth-btn").onclick = async () => {
      const username = $("username").value.trim();
      const password = $("password").value;
      $("login-error").textContent = "";
      if (!username || !password) {
        $("login-error").textContent = "请输入用户名和密码";
        return;
      }
      const path = isBootstrap ? "/api/auth/register" : "/api/auth/login";
      try {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("login-error").textContent = data.detail || "失败";
          return;
        }
        setAuth(data.token, data.username);
        showChat(data.username);
      } catch (e) {
        $("login-error").textContent = "网络错误";
      }
    };

    $("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("auth-btn").click();
    });

    $("logout-btn").onclick = async () => {
      try { await api("/api/auth/logout", { method: "POST" }); } catch (_) {}
      clearAuth();
      history = [];
      location.reload();
    };

    $("clear-btn").onclick = () => {
      history = [];
      $("messages").innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.id = "empty-hint";
      empty.innerHTML = "发送消息开始对话<br />支持网络搜索与网页抓取";
      $("messages").appendChild(empty);
    };

    function removeEmpty() {
      const el = $("empty-hint");
      if (el) el.remove();
    }

    function appendMsg(role, content, isStatus) {
      removeEmpty();
      const div = document.createElement("div");
      div.className = "msg " + (isStatus ? "status" : role);
      if (!isStatus) {
        const r = document.createElement("div");
        r.className = "role";
        r.textContent = role === "user" ? "你" : "助手";
        div.appendChild(r);
      }
      const c = document.createElement("div");
      c.className = "content";
      c.textContent = content;
      div.appendChild(c);
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return c;
    }

    function autoResize() {
      const ta = $("input");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }
    $("input").addEventListener("input", autoResize);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    $("send-btn").onclick = send;

    async function send() {
      if (busy) return;
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      autoResize();

      history.push({ role: "user", content: text });
      appendMsg("user", text);

      busy = true;
      $("send-btn").disabled = true;
      $("model-select").disabled = true;

      const contentEl = appendMsg("assistant", "思考中…");
      let full = "";
      let statusEl = null;
      let gotContent = false;
      const controller = new AbortController();
      const selectedModel = $("model-select").value || "";
      const requestTimeout = selectedModel.startsWith("deepseek-") ? 180000 : 120000;
      const requestTimer = setTimeout(() => controller.abort(), requestTimeout);

      try {
        const res = await api("/v1/chat/completions", {
          method: "POST",
          signal: controller.signal,
          body: JSON.stringify({
            model: selectedModel || null,
            messages: history.map((m) => ({ role: m.role, content: m.content })),
            stream: true,
          }),
        });

        if (res.status === 401) {
          contentEl.textContent = "登录已失效，请重新登录";
          clearAuth();
          setTimeout(() => location.reload(), 1200);
          return;
        }
        if (!res.ok) {
          const err = await res.text();
          contentEl.textContent = "请求失败: " + err.slice(0, 400);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n");
          buf = parts.pop() || "";
          for (const line of parts) {
            const t = line.trim();
            if (!t.startsWith("data:")) continue;
            const payload = t.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const obj = JSON.parse(payload);
              if (obj.status) {
                const s = obj.status;
                let label = s.message || "";
                if (s.type === "thinking") label = "💭 思考中…";
                else if (s.type === "tool_start")
                  label = "🔧 调用工具: " + (s.tools || []).join(", ") + " (第 " + s.round + " 轮)";
                else if (s.type === "tool_running")
                  label = "⏳ 执行中: " + (s.tools || []).join(", ") + "…";
                else if (s.type === "tool_done")
                  label = "✓ 工具完成: " + (s.tools || []).join(", ");
                else if (!label) label = JSON.stringify(s);
                if (statusEl) statusEl.textContent = label;
                else statusEl = appendMsg("status", label, true);
                if (!gotContent) contentEl.textContent = "…";
                continue;
              }
              const delta = (((obj.choices || [])[0] || {}).delta) || {};
              if (delta.content) {
                if (!gotContent) {
                  full = "";
                  gotContent = true;
                }
                full += delta.content;
                contentEl.textContent = full;
                $("messages").scrollTop = $("messages").scrollHeight;
              }
            } catch (_) {}
          }
        }

        if (!gotContent) full = contentEl.textContent || "(无内容)";
        if (full === "思考中…" || full === "…") full = "(无内容)";
        contentEl.textContent = full;
        history.push({ role: "assistant", content: full });
      } catch (e) {
        if (e.name === "AbortError") {
          contentEl.textContent = gotContent
            ? full + "\n\n[请求超时，连接已停止]"
            : "请求等待过久，已自动停止，请重试。";
        } else {
          contentEl.textContent = "网络错误: " + e.message;
        }
      } finally {
        clearTimeout(requestTimer);
        busy = false;
        $("send-btn").disabled = false;
        $("model-select").disabled = false;
        $("input").focus();
      }
    }

    init();
  </script>
</body>
</html>
