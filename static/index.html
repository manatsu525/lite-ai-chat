<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite AI Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6c9eff;
      --accent-hover: #8bb3ff;
      --user: #1e3a5f;
      --assistant: #1a1d24;
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100%;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #0b1020;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.55rem 1rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--border));
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    /* ---- Login ---- */
    #login-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
    }
    .login-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.35rem;
    }
    .login-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0.6rem 0;
      min-height: 1.2em;
    }
    .login-card button { width: 100%; margin-top: 0.4rem; }

    /* ---- Chat ---- */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      min-height: 0;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .user-meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: center; }
    .model-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
    }
    #model-select {
      width: auto;
      min-width: 190px;
      padding: 0.5rem 2rem 0.5rem 0.7rem;
      color: var(--text);
    }
    #reasoning-depth {
      width: auto;
      min-width: 104px;
      padding: 0.5rem 1.8rem 0.5rem 0.65rem;
      color: var(--text);
    }
    .session-bar {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #conversation-select { flex: 1; min-width: 0; }
    .session-bar button { flex-shrink: 0; }
    .history-pager {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .history-pager button {
      width: 2.15rem;
      padding-left: 0;
      padding-right: 0;
    }
    #history-page-label {
      min-width: 2.9rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 680px) {
      header {
        align-items: center;
        gap: 0.4rem;
        padding: 0.4rem 0.55rem;
      }
      header .brand {
        width: 2.5rem;
        flex: 0 0 2.5rem;
        font-size: 0.7rem;
        line-height: 1.15;
      }
      header .user-meta {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(4, max-content);
        justify-content: end;
        gap: 0.3rem;
        font-size: 0.7rem;
      }
      #who { display: none; }
      .model-controls {
        grid-column: 1 / -1;
        width: 100%;
        gap: 0.3rem;
      }
      #model-select {
        flex: 1;
        width: 0;
        min-width: 0;
        max-width: none;
        height: 2rem;
        padding: 0.25rem 1.55rem 0.25rem 0.5rem;
        font-size: 0.78rem;
      }
      #reasoning-depth {
        flex: 0 0 6.2rem;
        width: 6.2rem;
        min-width: 0;
        height: 2rem;
        padding: 0.25rem 1.35rem 0.25rem 0.4rem;
        font-size: 0.72rem;
      }
      header .user-meta button {
        min-height: 1.85rem;
        padding: 0.28rem 0.45rem;
        font-size: 0.68rem;
        line-height: 1;
        white-space: nowrap;
      }
      .session-bar {
        gap: 0.35rem;
        padding: 0.35rem 0.55rem;
      }
      #conversation-select {
        height: 2rem;
        padding: 0.25rem 1.45rem 0.25rem 0.5rem;
        font-size: 0.76rem;
      }
      .session-bar button {
        min-height: 2rem;
        padding: 0.3rem 0.48rem;
        font-size: 0.7rem;
        line-height: 1;
        white-space: nowrap;
      }
      .history-pager { gap: 0.15rem; }
      .history-pager button {
        width: 1.8rem;
        padding-left: 0;
        padding-right: 0;
      }
      #history-page-label {
        min-width: 2.35rem;
        font-size: 0.65rem;
      }
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-anchor: none;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: min(780px, 100%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .msg .role {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .msg .content { white-space: normal; }
    .msg .content a { color: var(--accent); }
    .msg .content p { margin: 0.45rem 0; }
    .msg .content p:first-child { margin-top: 0; }
    .msg .content p:last-child { margin-bottom: 0; }
    .msg .content h1, .msg .content h2, .msg .content h3,
    .msg .content h4, .msg .content h5, .msg .content h6 {
      margin: 0.9rem 0 0.45rem;
      line-height: 1.3;
    }
    .msg .content h1 { font-size: 1.4rem; }
    .msg .content h2 { font-size: 1.25rem; }
    .msg .content h3 { font-size: 1.1rem; }
    .message-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.55rem;
      padding-top: 0.4rem;
      border-top: 1px solid rgba(154, 160, 166, 0.16);
    }
    .message-action {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.45rem;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .message-action:hover {
      color: var(--text);
      background: rgba(154, 160, 166, 0.1);
    }
    .message-action svg {
      width: 14px;
      height: 14px;
      pointer-events: none;
    }
    .usage-panel {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .usage-panel > summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      width: fit-content;
      max-width: 100%;
      padding: 0.22rem 0.4rem;
      cursor: pointer;
      list-style: none;
      border: 1px solid rgba(154, 160, 166, 0.16);
      border-radius: 6px;
      background: rgba(154, 160, 166, 0.055);
    }
    .usage-panel > summary::-webkit-details-marker { display: none; }
    .usage-panel > summary::before {
      content: "›";
      font-size: 0.9rem;
      transition: transform 0.15s ease;
    }
    .usage-panel[open] > summary::before { transform: rotate(90deg); }
    .usage-state {
      padding: 0.06rem 0.3rem;
      border-radius: 999px;
      background: rgba(108, 158, 255, 0.12);
      font-size: 0.68rem;
    }
    .usage-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.28rem 0.7rem;
      margin-top: 0.35rem;
      padding: 0.45rem 0.5rem;
      border-left: 2px solid rgba(108, 158, 255, 0.3);
      background: rgba(154, 160, 166, 0.045);
    }
    .usage-details span { overflow-wrap: anywhere; }
    .msg .content ul, .msg .content ol {
      margin: 0.45rem 0;
      padding-left: 1.5rem;
    }
    .msg .content li { margin: 0.2rem 0; }
    .msg .content blockquote {
      margin: 0.55rem 0;
      padding: 0.25rem 0.8rem;
      color: var(--muted);
      border-left: 3px solid var(--accent);
      background: rgba(108, 158, 255, 0.06);
    }
    .msg .content code {
      padding: 0.12rem 0.3rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
    }
    .msg .content pre {
      margin: 0;
      padding: 2.7rem 0.8rem 0.8rem;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0d11;
    }
    .msg .content pre code {
      padding: 0;
      border: 0;
      background: transparent;
      white-space: pre;
    }
    .code-block {
      position: relative;
      margin: 0.6rem 0;
    }
    .code-download {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      z-index: 1;
      display: inline-flex;
      width: 30px;
      height: 30px;
      padding: 0;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: rgba(23, 26, 33, 0.92);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .code-download:hover {
      color: var(--text);
      background: var(--panel);
      border-color: var(--muted);
    }
    .code-download svg {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .table-wrap {
      max-width: 100%;
      margin: 0.65rem 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .msg .content table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .msg .content th, .msg .content td {
      padding: 0.55rem 0.7rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .msg .content th { background: rgba(108, 158, 255, 0.12); }
    .msg .content tr:last-child td { border-bottom: 0; }
    .msg .content th:last-child, .msg .content td:last-child { border-right: 0; }
    .msg .content hr { margin: 0.8rem 0; border: 0; border-top: 1px solid var(--border); }
    .msg.status {
      align-self: center;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
    }
    .trace-panel {
      margin: 0 0 0.7rem;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: normal;
    }
    .trace-root {
      overflow: hidden;
      border: 1px solid rgba(154, 160, 166, 0.24);
      border-radius: 9px;
      background: rgba(10, 12, 16, 0.22);
    }
    .trace-root > summary,
    .trace-event > summary,
    .trace-result > summary {
      cursor: pointer;
      list-style: none;
    }
    .trace-root > summary::-webkit-details-marker,
    .trace-event > summary::-webkit-details-marker,
    .trace-result > summary::-webkit-details-marker {
      display: none;
    }
    .trace-root > summary {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.48rem 0.62rem;
      color: var(--text);
      font-weight: 600;
    }
    .trace-root > summary::before {
      content: "›";
      color: var(--muted);
      font-size: 1rem;
      transition: transform 0.15s ease;
    }
    .trace-root[open] > summary::before { transform: rotate(90deg); }
    .trace-live-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 158, 255, 0.14);
      animation: trace-pulse 1.25s ease-in-out infinite;
    }
    @keyframes trace-pulse {
      50% { opacity: 0.35; transform: scale(0.82); }
    }
    .trace-body {
      padding: 0 0.55rem 0.55rem;
      border-top: 1px solid rgba(154, 160, 166, 0.16);
    }
    .trace-event {
      margin-top: 0.45rem;
      border-left: 2px solid rgba(108, 158, 255, 0.36);
      padding-left: 0.52rem;
    }
    .trace-event > summary {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 1.7rem;
      color: var(--text);
      word-break: break-word;
    }
    .trace-event > summary::before {
      content: "＋";
      flex: 0 0 1rem;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
    }
    .trace-event[open] > summary::before { content: "－"; }
    .trace-event-state {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.72rem;
      white-space: nowrap;
    }
    .trace-event-content {
      padding: 0.35rem 0 0.2rem 1.4rem;
    }
    .trace-query, .trace-excerpt, .trace-error {
      margin: 0.25rem 0;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      background: rgba(154, 160, 166, 0.08);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .trace-error { color: #ff8e8e; }
    .trace-result {
      margin-top: 0.35rem;
      border: 1px solid rgba(154, 160, 166, 0.16);
      border-radius: 7px;
      background: rgba(154, 160, 166, 0.045);
    }
    .trace-result > summary {
      padding: 0.38rem 0.5rem;
      color: var(--text);
      word-break: break-word;
    }
    .trace-result-body {
      padding: 0.1rem 0.5rem 0.48rem;
      border-top: 1px solid rgba(154, 160, 166, 0.12);
    }
    .trace-result-body a, .trace-event-content > a {
      display: inline-block;
      max-width: 100%;
      margin-top: 0.3rem;
      color: var(--accent);
      overflow-wrap: anywhere;
    }
    .trace-result-snippet {
      margin-top: 0.3rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .composer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.75rem 1rem 1rem;
    }
    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .attachment-tray {
      display: none;
      max-width: 860px;
      max-height: 92px;
      margin: 0 auto 0.5rem;
      padding: 0.4rem;
      overflow-y: auto;
      gap: 0.35rem;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .attachment-tray.visible { display: flex; }
    .attachment-chip {
      display: inline-flex;
      max-width: 100%;
      align-items: center;
      gap: 0.35rem;
      padding: 0.28rem 0.4rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.72rem;
    }
    .attachment-chip .attachment-name {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attachment-remove {
      width: 1.2rem;
      height: 1.2rem;
      padding: 0;
      color: var(--danger);
      background: transparent;
      border: 0;
      line-height: 1;
    }
    .attachment-remove:hover { color: #ff9aa0; background: transparent; }
    .attach-btn {
      width: 48px;
      padding: 0 !important;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      font-size: 1.25rem;
    }
    .attach-btn:hover { color: var(--text); background: var(--bg); }
    .attachment-status {
      max-width: 860px;
      min-height: 0;
      margin: 0.3rem auto 0;
      color: var(--muted);
      font-size: 0.72rem;
    }
    .attachment-status.bad { color: var(--danger); }
    .composer textarea {
      min-height: 48px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
    }
    .composer button { flex-shrink: 0; height: 48px; padding: 0 1.2rem; }
    .hint {
      max-width: 860px;
      margin: 0.4rem auto 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .settings-card {
      width: min(640px, 100%);
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .settings-head h2 { font-size: 1.1rem; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .settings-grid .wide { grid-column: 1 / -1; }
    .settings-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
    }
    .settings-note, .settings-status {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.55rem;
      line-height: 1.5;
    }
    .settings-status.ok { color: var(--ok); }
    .settings-status.bad { color: var(--danger); }
    .model-list {
      margin-top: 0.55rem;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
    }
    .model-option {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .model-option:hover { background: var(--bg); }
    .model-option input { width: auto; margin-top: 0.18rem; }
    .account-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin: 0.8rem 0 1rem;
    }
    .account-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .account-info { flex: 1; min-width: 0; }
    .account-name { font-weight: 600; word-break: break-all; }
    .account-meta {
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .account-row button { flex-shrink: 0; }
    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .wide { grid-column: auto; }
      .composer {
        padding: 0.45rem 0.55rem calc(0.45rem + env(safe-area-inset-bottom));
      }
      .composer-inner { gap: 0.35rem; }
      .composer textarea { min-height: 40px; }
      .attach-btn { width: 40px !important; }
      .composer button {
        height: 40px;
        padding: 0 0.75rem;
      }
      .hint {
        margin-top: 0.25rem;
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>
  <!-- 登录 / 首次注册 -->
  <div id="login-view">
    <div class="login-card">
      <h1>Lite AI Chat</h1>
      <p class="sub" id="login-sub">登录后长期有效，无需反复输入</p>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="error" id="login-error"></div>
      <button id="auth-btn" type="button">登录</button>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat-view">
    <header>
      <div class="brand">Lite AI Chat</div>
      <div class="user-meta">
        <div class="model-controls">
          <select id="model-select" aria-label="选择模型" title="选择模型"></select>
          <select id="reasoning-depth" aria-label="思考深度" title="选择思考深度">
            <option value="normal">普通思考（4轮，最多8次工具）</option>
            <option value="deep">深度思考</option>
          </select>
        </div>
        <span id="who"></span>
        <button class="ghost" id="settings-btn" type="button">API / 模型</button>
        <button class="ghost" id="admin-btn" type="button" style="display:none">账号管理</button>
        <button class="ghost" id="clear-btn" type="button">清空</button>
        <button class="ghost" id="logout-btn" type="button">退出</button>
      </div>
    </header>
    <div class="session-bar">
      <select id="conversation-select" aria-label="最近对话"></select>
      <div class="history-pager" aria-label="历史分页">
        <button class="ghost" id="history-prev" type="button" title="上一页" aria-label="上一页">‹</button>
        <span id="history-page-label">1/1</span>
        <button class="ghost" id="history-next" type="button" title="下一页" aria-label="下一页">›</button>
      </div>
      <button class="ghost" id="new-chat-btn" type="button">新对话</button>
      <button class="danger" id="delete-chat-btn" type="button">删除</button>
    </div>
    <div id="messages">
      <div class="empty" id="empty-hint">发送消息开始对话<br />支持网络搜索与网页抓取</div>
    </div>
    <div class="composer">
      <div class="attachment-tray" id="attachment-tray"></div>
      <div class="composer-inner">
        <input id="file-input" type="file" multiple hidden />
        <button class="attach-btn" id="attach-btn" type="button" title="上传图片或文件" aria-label="上传图片或文件">＋</button>
        <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
        <button class="danger" id="stop-btn" type="button" style="display:none">停止</button>
        <button id="send-btn" type="button">发送</button>
      </div>
      <div class="attachment-status" id="attachment-status"></div>
      <div class="hint">生成在服务器后台继续，刷新、锁屏或关闭页面后可回来查看 · 后端自动多轮工具调用</div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true">
    <div class="settings-card">
      <div class="settings-head">
        <h2>API 与模型设置</h2>
        <button class="ghost" id="settings-close" type="button">关闭</button>
      </div>
      <div class="settings-grid">
        <div class="field">
          <label for="provider-select">提供商配置</label>
          <select id="provider-select"></select>
        </div>
        <div class="field">
          <label for="provider-id">配置标识</label>
          <input id="provider-id" placeholder="例如 groq" />
        </div>
        <div class="field">
          <label for="provider-label">显示名称</label>
          <input id="provider-label" placeholder="例如 Groq" />
        </div>
        <div class="field">
          <label for="provider-key">API Key</label>
          <input id="provider-key" type="password" autocomplete="off" placeholder="留空则使用已保存密钥" />
        </div>
        <div class="field wide">
          <label for="provider-base">OpenAI 兼容 API 地址</label>
          <input id="provider-base" placeholder="https://api.example.com/v1" />
        </div>
        <div class="field wide">
          <label for="manual-models">手动模型名（可选）</label>
          <textarea id="manual-models" rows="3" placeholder="每行一个或用逗号分隔，例如：provider/new-model"></textarea>
        </div>
      </div>
      <div class="settings-actions">
        <button id="provider-test" type="button">测试 API 并读取模型</button>
      </div>
      <div class="settings-status" id="provider-status"></div>
      <div id="models-panel" style="display:none">
        <div class="field" style="margin-top:0.9rem">
          <label for="model-filter">筛选模型</label>
          <input id="model-filter" placeholder="输入模型名称…" />
        </div>
        <div class="model-list" id="provider-models"></div>
        <div class="settings-actions">
          <button id="provider-save" type="button">保存所选模型</button>
          <button class="danger" id="provider-delete" type="button">删除此 API 配置</button>
        </div>
      </div>
      <p class="settings-note">
        API Key 只写入服务器的受限配置文件，页面不会读取或回显完整密钥。手填模型会通过最小聊天请求直接验证，不要求出现在 /models 中。
      </p>
    </div>
  </div>

  <div class="modal-backdrop" id="admin-modal" role="dialog" aria-modal="true">
    <div class="settings-card">
      <div class="settings-head">
        <h2>账号管理</h2>
        <button class="ghost" id="admin-close" type="button">关闭</button>
      </div>
      <p class="settings-note" id="account-limit-note">
        最多 3 个账号；各账号的对话历史与后台任务相互独立。
      </p>
      <div class="account-list" id="account-list"></div>
      <div class="settings-grid">
        <div class="field">
          <label for="account-username">新账号用户名</label>
          <input id="account-username" maxlength="40" autocomplete="off" />
        </div>
        <div class="field">
          <label for="account-password">新账号密码</label>
          <input id="account-password" type="password" maxlength="72" autocomplete="new-password" />
        </div>
      </div>
      <div class="settings-actions">
        <button id="account-create" type="button">新增普通账号</button>
      </div>
      <div class="settings-status" id="account-status"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "lite_ai_token";
    const USER_KEY = "lite_ai_user";
    const MODEL_KEY = "lite_ai_model";
    const REASONING_DEPTH_KEY = "lite_ai_reasoning_depth";
    let history = []; // {role, content}
    let busy = false;
    let isBootstrap = false;
    let providerSettings = [];
    let testedModels = [];
    let savedProviderModels = [];
    let conversations = [];
    let conversationPage = 1;
    let conversationTotal = 0;
    let conversationTotalPages = 1;
    let currentConversationId = "";
    let currentJobId = "";
    let jobPollTimer = null;
    let isAdmin = false;
    let currentUserId = 0;
    let pendingAttachments = [];
    let uploadingAttachments = false;
    const MAX_ATTACHMENT_FILES = 10;
    const MAX_ATTACHMENT_BYTES = 50 * 1024 * 1024;

    const $ = (id) => document.getElementById(id);

    // Android 浏览器的地址栏会让 100vh 高于实际可见区域；始终使用真实视口高度。
    let viewportFrame = 0;
    function syncAppHeight() {
      cancelAnimationFrame(viewportFrame);
      viewportFrame = requestAnimationFrame(() => {
        const viewport = window.visualViewport;
        const height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty(
          "--app-height",
          Math.max(1, Math.round(height)) + "px",
        );
      });
    }
    syncAppHeight();
    window.addEventListener("resize", syncAppHeight);
    window.addEventListener("orientationchange", syncAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncAppHeight);
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }
    function setAuth(token, username) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, username || "");
    }
    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { cache: "no-store", ...opts, headers });
      return res;
    }

    async function init() {
      // 检查是否已登录
      if (getToken()) {
        const res = await api("/api/auth/me");
        if (res.ok) {
          const me = await res.json();
          currentUserId = Number(me.id) || 0;
          showChat(me.username, me.is_admin);
          return;
        }
        clearAuth();
      }
      // 是否首次启动（无用户）
      try {
        const st = await fetch("/api/auth/status").then((r) => r.json());
        isBootstrap = !st.has_users;
        $("login-sub").textContent = isBootstrap
          ? "首次启动：创建管理员账号（之后登录长期有效）"
          : "登录后长期有效，无需反复输入";
        $("auth-btn").textContent = isBootstrap ? "创建账号并登录" : "登录";
      } catch (e) {
        $("login-error").textContent = "无法连接服务器";
      }
      $("login-view").style.display = "flex";
      $("chat-view").style.display = "none";
    }

    async function showChat(username, adminFlag) {
      isAdmin = Boolean(adminFlag);
      $("login-view").style.display = "none";
      $("chat-view").style.display = "flex";
      $("who").textContent = username || localStorage.getItem(USER_KEY) || "";
      $("settings-btn").style.display = isAdmin ? "" : "none";
      $("admin-btn").style.display = isAdmin ? "" : "none";
      await Promise.all([loadModels(), loadConversations()]);
      await resumeActiveJob();
    }

    async function loadModels() {
      const select = $("model-select");
      select.disabled = true;
      try {
        const res = await api("/v1/models");
        if (!res.ok) throw new Error("模型列表加载失败");
        const payload = await res.json();
        const models = payload.data || [];
        select.innerHTML = "";
        for (const model of models) {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = model.label || model.id;
          select.appendChild(option);
        }
        const saved = localStorage.getItem(MODEL_KEY);
        const selected = models.some((m) => m.id === saved) ? saved : payload.default;
        select.value = selected || (models[0] && models[0].id) || "";
        if (select.value) localStorage.setItem(MODEL_KEY, select.value);
        if (!models.length) {
          select.innerHTML = '<option value="">请先配置 API</option>';
        }
      } catch (e) {
        select.innerHTML = '<option value="">模型不可用</option>';
      } finally {
        select.disabled = false;
      }
    }

    $("model-select").addEventListener("change", (e) => {
      localStorage.setItem(MODEL_KEY, e.target.value);
    });
    const savedReasoningDepth = localStorage.getItem(REASONING_DEPTH_KEY);
    $("reasoning-depth").value =
      savedReasoningDepth === "normal" ? "normal" : "deep";
    $("reasoning-depth").addEventListener("change", (e) => {
      localStorage.setItem(REASONING_DEPTH_KEY, e.target.value);
    });

    function newConversationId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return "chat-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function currentTitle() {
      const first = history.find((item) => item.role === "user" && item.content.trim());
      return first ? first.content.trim().replace(/\s+/g, " ").slice(0, 32) : "新对话";
    }

    function renderConversationSelect() {
      const select = $("conversation-select");
      select.innerHTML = "";
      for (const item of conversations.slice(0, 10)) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.title || "新对话";
        select.appendChild(option);
      }
      select.value = currentConversationId;
      renderHistoryPager();
    }

    function renderHistoryPager() {
      $("history-page-label").textContent =
        conversationPage + "/" + conversationTotalPages;
      $("history-prev").disabled = busy || conversationPage <= 1;
      $("history-next").disabled =
        busy || conversationPage >= conversationTotalPages;
    }

    function renderConversation() {
      $("messages").innerHTML = "";
      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.id = "empty-hint";
        empty.innerHTML = "发送消息开始对话<br />支持网络搜索与网页抓取";
        $("messages").appendChild(empty);
        return;
      }
      history.forEach((item, index) => {
        appendMsg(item.role, item.content, false, {
          messageIndex: index,
          showActions: true,
          trace: item.trace || [],
          usage: item.usage || {},
        });
      });
    }

    function createConversation() {
      pendingAttachments = [];
      renderAttachments();
      currentConversationId = newConversationId();
      history = [];
      conversations.unshift({
        id: currentConversationId,
        title: "新对话",
        messages: [],
        updated_at: new Date().toISOString(),
      });
      conversations = conversations.slice(0, 10);
      renderConversationSelect();
      renderConversation();
    }

    async function loadConversationDetail(conversationId) {
      const res = await api(
        "/api/conversations/" + encodeURIComponent(conversationId),
      );
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "对话内容加载失败");
      if (!Array.isArray(data.messages)) throw new Error("对话内容格式错误");
      let item = conversations.find((entry) => entry.id === conversationId);
      if (!item) {
        item = data;
        conversations.unshift(item);
      } else {
        Object.assign(item, data);
      }
      currentConversationId = item.id;
      history = item.messages.map((message) => ({
        role: message.role,
        content: message.content || "",
        trace: Array.isArray(message.trace) ? message.trace : [],
        usage: message.usage && typeof message.usage === "object"
          ? message.usage : {},
      }));
      renderConversationSelect();
      renderConversation();
      await loadPendingAttachments();
      return item;
    }

    async function loadConversations(page = 1, preferredId = "") {
      let lastError = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          // 标题列表通常只有几 KB；正文仅按当前选择单独读取。
          const res = await api(
            "/api/conversations/summaries?page=" + encodeURIComponent(page),
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.detail || "对话历史加载失败");
          if (!Array.isArray(data.data)) throw new Error("对话历史格式错误");
          conversations = data.data;
          conversationPage = Number(data.page) || 1;
          conversationTotal = Number(data.total) || 0;
          conversationTotalPages = Number(data.total_pages) || 1;
          if (conversations.length) {
            const preferred = conversations.find((item) => item.id === preferredId);
            currentConversationId = preferred
              ? preferred.id
              : conversations[0].id;
            renderConversationSelect();
            await loadConversationDetail(currentConversationId);
          } else {
            createConversation();
            await persistConversation(true);
          }
          $("new-chat-btn").disabled = false;
          $("delete-chat-btn").disabled = false;
          return true;
        } catch (error) {
          lastError = error;
          if (attempt < 2) {
            await new Promise((resolve) => setTimeout(resolve, 350 * (attempt + 1)));
          }
        }
      }
      // 不再把加载失败静默伪装成“没有历史”，也不覆盖页面已有的对话。
      if (!conversations.length) {
        currentConversationId = "";
        history = [];
        const select = $("conversation-select");
        select.innerHTML = '<option value="">历史加载失败，请刷新重试</option>';
        $("new-chat-btn").disabled = true;
        $("delete-chat-btn").disabled = true;
        conversationPage = 1;
        conversationTotal = 0;
        conversationTotalPages = 1;
        renderHistoryPager();
        renderConversation();
      }
      console.error("对话历史加载失败", lastError);
      return false;
    }

    async function persistConversation(allowEmpty = false) {
      if (!currentConversationId || (!history.length && !allowEmpty)) return false;
      const title = currentTitle();
      let item = conversations.find((entry) => entry.id === currentConversationId);
      if (!item) {
        item = { id: currentConversationId };
        conversations.unshift(item);
      }
      item.title = title;
      item.messages = history.map((message) => ({
        role: message.role,
        content: message.content,
        trace: Array.isArray(message.trace) ? message.trace : [],
        usage: message.usage && typeof message.usage === "object"
          ? message.usage : {},
      }));
      item.updated_at = new Date().toISOString();
      conversations = [item, ...conversations.filter((entry) => entry.id !== item.id)].slice(0, 10);
      renderConversationSelect();
      try {
        const res = await api("/api/conversations/" + encodeURIComponent(currentConversationId), {
          method: "PUT",
          body: JSON.stringify({ title, messages: item.messages }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "对话保存失败");
        }
        return true;
      } catch (error) {
        console.error("对话保存失败", error);
        return false;
      }
    }

    $("conversation-select").addEventListener("change", async (e) => {
      if (busy) {
        e.target.value = currentConversationId;
        return;
      }
      const nextId = e.target.value;
      const item = conversations.find((entry) => entry.id === nextId);
      if (!item) return;
      const previousId = currentConversationId;
      e.target.disabled = true;
      try {
        await loadConversationDetail(nextId);
      } catch (error) {
        console.error("对话内容加载失败", error);
        e.target.value = previousId;
        alert("对话内容加载失败，请重试");
      } finally {
        e.target.disabled = false;
      }
    });

    $("history-prev").onclick = async () => {
      if (busy || conversationPage <= 1) return;
      await loadConversations(conversationPage - 1);
    };

    $("history-next").onclick = async () => {
      if (busy || conversationPage >= conversationTotalPages) return;
      await loadConversations(conversationPage + 1);
    };

    $("new-chat-btn").onclick = async () => {
      if (busy) return;
      const current = conversations.find((item) => item.id === currentConversationId);
      if (current && !(current.messages || []).length && !history.length) return;
      createConversation();
      // 即使尚未发送消息，刷新页面后这个新窗口仍然存在。
      const createdId = currentConversationId;
      if (await persistConversation(true)) {
        await loadConversations(1, createdId);
      }
    };

    $("delete-chat-btn").onclick = async () => {
      if (busy || !currentConversationId) return;
      if (!confirm("删除当前对话？")) return;
      const deleting = currentConversationId;
      conversations = conversations.filter((item) => item.id !== deleting);
      try {
        await api("/api/conversations/" + encodeURIComponent(deleting), { method: "DELETE" });
      } catch (_) {}
      await loadConversations(conversationPage);
    };

    function providerPayload() {
      const manualModels = $("manual-models").value
        .split(/[\n,]+/)
        .map((item) => item.trim())
        .filter(Boolean);
      return {
        provider_id: $("provider-id").value.trim(),
        provider_label: $("provider-label").value.trim(),
        api_base: $("provider-base").value.trim(),
        api_key: $("provider-key").value.trim(),
        selected_models: Array.from(new Set(manualModels)),
      };
    }

    function setProviderStatus(message, kind = "") {
      const el = $("provider-status");
      el.textContent = message;
      el.className = "settings-status " + kind;
    }

    function renderProviderModels(models, selected = []) {
      testedModels = models.slice();
      const selectedSet = new Set(selected);
      const list = $("provider-models");
      list.innerHTML = "";
      for (const model of models) {
        const label = document.createElement("label");
        label.className = "model-option";
        label.dataset.model = model.toLowerCase();
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = model;
        checkbox.checked = selectedSet.has(model);
        const text = document.createElement("span");
        text.textContent = model;
        label.append(checkbox, text);
        list.appendChild(label);
      }
      $("models-panel").style.display = models.length ? "block" : "none";
      $("model-filter").value = "";
    }

    function applyProvider(providerId) {
      const item = providerSettings.find((p) => p.provider_id === providerId);
      if (item) {
        $("provider-id").value = item.provider_id;
        $("provider-label").value = item.provider_label || item.provider_id;
        $("provider-base").value = item.api_base || "";
        $("provider-key").value = "";
        $("manual-models").value = "";
        $("provider-key").placeholder = item.configured
          ? "已保存 " + (item.api_key_masked || "密钥") + "；留空保持不变"
          : "输入 API Key";
        savedProviderModels = (item.models || []).slice();
        renderProviderModels(savedProviderModels, savedProviderModels);
        $("provider-delete").disabled = !item.configured;
        setProviderStatus(
          item.configured
            ? "可取消勾选模型后保存，或删除整个 API 配置；测试可刷新模型列表。"
            : ""
        );
      } else {
        $("provider-id").value = "custom";
        $("provider-label").value = "Custom";
        $("provider-base").value = "";
        $("provider-key").value = "";
        $("manual-models").value = "";
        $("provider-key").placeholder = "输入 API Key";
        savedProviderModels = [];
        renderProviderModels([], []);
        $("provider-delete").disabled = true;
        setProviderStatus("");
      }
    }

    async function openSettings() {
      if (!isAdmin) return;
      $("settings-modal").classList.add("open");
      setProviderStatus("正在读取配置…");
      try {
        const res = await api("/api/settings/providers");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "读取配置失败");
        providerSettings = data.providers || [];
        const select = $("provider-select");
        select.innerHTML = "";
        for (const item of providerSettings) {
          const option = document.createElement("option");
          option.value = item.provider_id;
          option.textContent = item.provider_label || item.provider_id;
          select.appendChild(option);
        }
        const custom = document.createElement("option");
        custom.value = "__custom__";
        custom.textContent = "其他 OpenAI 兼容接口";
        select.appendChild(custom);
        applyProvider((providerSettings[0] || {}).provider_id || "__custom__");
      } catch (e) {
        setProviderStatus(e.message, "bad");
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInlineMarkdown(value) {
      const codeTokens = [];
      let text = escapeHtml(value).replace(/`([^`\n]+)`/g, (_, code) => {
        const token = "\u0000CODE" + codeTokens.length + "\u0000";
        codeTokens.push("<code>" + code + "</code>");
        return token;
      });
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
        const decoded = url.replace(/&amp;/g, "&");
        if (!/^https?:\/\//i.test(decoded)) return label + " (" + url + ")";
        return '<a href="' + escapeHtml(decoded) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
      });
      text = text
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      return text.replace(/\u0000CODE(\d+)\u0000/g, (_, index) => codeTokens[Number(index)] || "");
    }

    function splitTableRow(line) {
      let value = line.trim();
      if (value.startsWith("|")) value = value.slice(1);
      if (value.endsWith("|")) value = value.slice(0, -1);
      return value.split("|").map((cell) => cell.trim());
    }

    function isTableDivider(line) {
      const cells = splitTableRow(line);
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      const out = [];
      let paragraph = [];
      let listType = "";

      const flushParagraph = () => {
        if (!paragraph.length) return;
        out.push("<p>" + paragraph.map(renderInlineMarkdown).join("<br>") + "</p>");
        paragraph = [];
      };
      const closeList = () => {
        if (listType) out.push("</" + listType + ">");
        listType = "";
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (/^```/.test(trimmed)) {
          flushParagraph();
          closeList();
          const language = trimmed.slice(3).trim().split(/\s+/)[0] || "";
          const code = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            code.push(lines[i]);
            i++;
          }
          const languageClass = language
            ? ' class="language-' + escapeHtml(language.replace(/[^a-zA-Z0-9_-]/g, "")) + '"'
            : "";
          const safeLanguage = language.toLowerCase().replace(/[^a-z0-9_+#.-]/g, "");
          out.push(
            '<div class="code-block" data-language="' + escapeHtml(safeLanguage) + '">' +
            '<button class="code-download" type="button" title="下载代码" aria-label="下载代码">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">' +
            '<path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"></path></svg></button>' +
            "<pre><code" + languageClass + ">" + escapeHtml(code.join("\n")) + "</code></pre></div>"
          );
          continue;
        }

        if (
          line.includes("|") &&
          i + 1 < lines.length &&
          isTableDivider(lines[i + 1])
        ) {
          flushParagraph();
          closeList();
          const headers = splitTableRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
            rows.push(splitTableRow(lines[i]));
            i++;
          }
          i--;
          let table = '<div class="table-wrap"><table><thead><tr>';
          table += headers.map((cell) => "<th>" + renderInlineMarkdown(cell) + "</th>").join("");
          table += "</tr></thead><tbody>";
          for (const row of rows) {
            table += "<tr>" + headers.map((_, index) =>
              "<td>" + renderInlineMarkdown(row[index] || "") + "</td>"
            ).join("") + "</tr>";
          }
          table += "</tbody></table></div>";
          out.push(table);
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          out.push("<h" + level + ">" + renderInlineMarkdown(heading[2]) + "</h" + level + ">");
          continue;
        }
        if (/^([-*_])(?:\s*\1){2,}$/.test(trimmed)) {
          flushParagraph();
          closeList();
          out.push("<hr>");
          continue;
        }
        if (trimmed.startsWith("> ")) {
          flushParagraph();
          closeList();
          out.push("<blockquote>" + renderInlineMarkdown(trimmed.slice(2)) + "</blockquote>");
          continue;
        }

        const unordered = trimmed.match(/^[-*+]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const nextType = unordered ? "ul" : "ol";
          if (listType !== nextType) {
            closeList();
            listType = nextType;
            out.push("<" + listType + ">");
          }
          out.push("<li>" + renderInlineMarkdown((unordered || ordered)[1]) + "</li>");
          continue;
        }

        closeList();
        paragraph.push(line);
      }
      flushParagraph();
      closeList();
      return out.join("");
    }

    const CODE_EXTENSIONS = {
      python: "py", py: "py", javascript: "js", js: "js",
      typescript: "ts", ts: "ts", jsx: "jsx", tsx: "tsx",
      bash: "sh", shell: "sh", sh: "sh", zsh: "sh",
      html: "html", css: "css", json: "json", yaml: "yml", yml: "yml",
      xml: "xml", sql: "sql", java: "java", kotlin: "kt", c: "c",
      cpp: "cpp", "c++": "cpp", csharp: "cs", "c#": "cs",

    $("messages").addEventListener("click", (event) => {
      const action = event.target.closest(".message-action");
      if (action) {
        const index = Number(action.dataset.messageIndex);
        if (!Number.isInteger(index) || !history[index]) return;
        if (action.dataset.action === "copy") {
          copyMessage(history[index].content || "", action);
        } else if (action.dataset.action === "retry") {
          retryMessage(index);
        }
        return;
      }

      const downloadButton = event.target.closest(".code-download");
      if (downloadButton) {
        const block = downloadButton.closest(".code-block");
        const code = block && block.querySelector("code");
        if (!code) return;
        const language = (block.dataset.language || "").toLowerCase();
        const extension = CODE_EXTENSIONS[language] || "txt";
        const filename = extension === "Dockerfile"
          ? "Dockerfile"
          : "code-" + Date.now() + "." + extension;
        const blob = new Blob([code.textContent], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    });

    async function copyMessage(text, button) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const input = document.createElement("textarea");
          input.value = text;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        const oldLabel = button.querySelector("span").textContent;
        button.querySelector("span").textContent = "已复制";
        setTimeout(() => {
          const label = button.querySelector("span");
          if (label) label.textContent = oldLabel;
        }, 1200);
      } catch (_) {}
    }

    function renderTracePanel(container, trace, active = false, statusMessage = "") {
      if (!container) return;
      const previous = container.querySelector(".trace-panel");
      const previousRoot = previous && previous.querySelector(".trace-root");
      const rootWasOpen = previousRoot ? previousRoot.open : active;
      const openedEvents = new Set();
      const openedResults = new Set();
      if (previous) {
        previous.querySelectorAll(".trace-event[open]").forEach((item) => {
          openedEvents.add(item.dataset.eventId || "");
        });
        previous.querySelectorAll(".trace-result[open]").forEach((item) => {
          openedResults.add(item.dataset.resultId || "");
        });
        previous.remove();
      }

      let events = Array.isArray(trace) ? trace.slice() : [];
      if (!events.length && statusMessage) {
        events = [{
          id: "current-status",
          kind: "thinking",
          title: statusMessage,
          state: active ? "running" : "done",
        }];
      }
      if (!events.length) return;

      const panel = document.createElement("div");
      panel.className = "trace-panel";
      const root = document.createElement("details");
      root.className = "trace-root";
      root.open = rootWasOpen;
      const rootSummary = document.createElement("summary");
      if (active) {
        const dot = document.createElement("span");
        dot.className = "trace-live-dot";
        dot.setAttribute("aria-hidden", "true");
        rootSummary.appendChild(dot);
      }
      const rootLabel = document.createElement("span");
      rootLabel.textContent =
        (active ? "正在思考" : "思考与工具") + " · " + events.length + " 个步骤";
      rootSummary.appendChild(rootLabel);
      root.appendChild(rootSummary);

      const body = document.createElement("div");
      body.className = "trace-body";
      for (const event of events) {
        const eventDetails = document.createElement("details");
        eventDetails.className = "trace-event";
        eventDetails.dataset.eventId = String(event.id || "");
        eventDetails.open = openedEvents.has(eventDetails.dataset.eventId);
        const eventSummary = document.createElement("summary");
        const title = document.createElement("span");
        title.textContent = event.title || "处理中";
        eventSummary.appendChild(title);
        const state = document.createElement("span");
        state.className = "trace-event-state";
        state.textContent =
          event.state === "running" ? "进行中" :
          event.state === "error" ? "失败" : "完成";
        eventSummary.appendChild(state);
        eventDetails.appendChild(eventSummary);

        const eventContent = document.createElement("div");
        eventContent.className = "trace-event-content";
        if (event.query) {
          const query = document.createElement("div");
          query.className = "trace-query";
          query.textContent = "关键词：" + event.query;
          eventContent.appendChild(query);
        }
        if (event.error) {
          const error = document.createElement("div");
          error.className = "trace-error";
          error.textContent = event.error;
          eventContent.appendChild(error);
        }
        if (event.warning) {
          const warning = document.createElement("div");
          warning.className = "trace-query";
          warning.textContent =
            event.warning + "；下方内容为搜索索引摘要，并非网页全文。";
          eventContent.appendChild(warning);
        }
        if (event.routing_note) {
          const routingNote = document.createElement("div");
          routingNote.className = "trace-query";
          routingNote.textContent = event.routing_note;
          eventContent.appendChild(routingNote);
        }
        if (event.kind === "search") {
          const results = Array.isArray(event.results) ? event.results : [];
          if (!results.length && event.state !== "running" && !event.error) {
            const empty = document.createElement("div");
            empty.className = "trace-query";
            empty.textContent = "本轮搜索没有返回可展示的网页。";
            eventContent.appendChild(empty);
          }
          results.forEach((result, index) => {
            const resultDetails = document.createElement("details");
            resultDetails.className = "trace-result";
            resultDetails.dataset.resultId =
              String(event.id || "search") + "-" + index;
            resultDetails.open = openedResults.has(resultDetails.dataset.resultId);
            const resultSummary = document.createElement("summary");
            resultSummary.textContent =
              (index + 1) + ". " + (result.title || result.url || "搜索结果");
            resultDetails.appendChild(resultSummary);
            const resultBody = document.createElement("div");
            resultBody.className = "trace-result-body";
            const url = safeHttpUrl(result.url);
            if (url) {
              const link = document.createElement("a");
              link.href = url;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = "打开网页";
              resultBody.appendChild(link);
            }
            if (result.snippet) {
              const snippet = document.createElement("div");
              snippet.className = "trace-result-snippet";
              snippet.textContent = result.snippet;
              resultBody.appendChild(snippet);
            }
            resultDetails.appendChild(resultBody);
            eventContent.appendChild(resultDetails);
          });
        } else if (event.kind === "page") {
          if (event.source || event.extraction) {
            const method = document.createElement("div");
            method.className = "trace-query";
            method.textContent =
              "抓取方式：" + (event.source || "未知") +
              (event.extraction ? " · 正文提取：" + event.extraction : "");
            eventContent.appendChild(method);
          }
          const url = safeHttpUrl(event.url);
          if (url) {
            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "打开读取的网页";
            eventContent.appendChild(link);
          }
          if (event.excerpt) {
            const excerpt = document.createElement("div");
            excerpt.className = "trace-excerpt";
            excerpt.textContent = event.excerpt;
            eventContent.appendChild(excerpt);
          }
        } else if (!event.query && !event.error) {
          const explanation = document.createElement("div");
          explanation.className = "trace-query";
          explanation.textContent =
            event.state === "running" ? "正在等待模型返回这一阶段的结果…" :
            "该阶段已经完成。";
          eventContent.appendChild(explanation);
        }
        eventDetails.appendChild(eventContent);
        body.appendChild(eventDetails);
      }
      root.appendChild(body);
      panel.appendChild(root);
      const content = container.querySelector(".content");
      container.insertBefore(panel, content || null);
    }

    function usageNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.floor(number) : 0;
    }

    function formatTokenCount(value) {
      return new Intl.NumberFormat("zh-CN").format(usageNumber(value));
    }

    function renderUsagePanel(container, rawUsage, active = false) {
      if (!container) return;
      const previous = container.querySelector(".usage-panel");
      const wasOpen = Boolean(previous && previous.open);
      if (previous) previous.remove();
      const usage = rawUsage && typeof rawUsage === "object" ? rawUsage : {};
      const calls = usageNumber(usage.api_calls);
      const prompt = usageNumber(usage.prompt_tokens);
      const completion = usageNumber(usage.completion_tokens);
      const total = usageNumber(usage.total_tokens);
      if (!calls && !prompt && !completion && !total) return;

      const panel = document.createElement("details");
      panel.className = "usage-panel";
      panel.open = wasOpen;
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      label.textContent =
        calls + " 次调用 · 输入 " + formatTokenCount(prompt) +
        " · 输出 " + formatTokenCount(completion) +
        " · 总计 " + formatTokenCount(total) + " token";
      summary.appendChild(label);
      const state = document.createElement("span");
      state.className = "usage-state";
      state.textContent = active
        ? "统计中"
        : usage.complete ? "完整" : "部分统计";
      summary.appendChild(state);
      panel.appendChild(summary);

      const details = document.createElement("div");
      details.className = "usage-details";
      const rows = [
        ["上报调用", formatTokenCount(usage.reported_calls) + "/" + formatTokenCount(calls)],
        ["缓存 token", formatTokenCount(usage.cached_tokens)],
        ["Reasoning token", formatTokenCount(usage.reasoning_tokens)],
      ];
      for (const row of rows) {
        const item = document.createElement("span");
        item.textContent = row[0] + "：" + row[1];
        details.appendChild(item);
      }
      panel.appendChild(details);
      const actions = container.querySelector(".message-actions");
      container.insertBefore(panel, actions || null);
    }

    function appendMsg(role, content, isStatus, options = {}) {
      removeEmpty();
      const messagesEl = $("messages");
      const wasNearBottom =
        messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
      const div = document.createElement("div");
      div.className = "msg " + (isStatus ? "status" : role);
      if (!isStatus) {
        const r = document.createElement("div");
        r.className = "role";
        r.textContent = role === "user" ? "你" : "助手";
        div.appendChild(r);
      }
      const c = document.createElement("div");
      c.className = "content";
      if (!isStatus && role === "assistant") setAssistantContent(c, content);
      else c.textContent = content;
      div.appendChild(c);
      if (!isStatus && role === "assistant" && options.trace) {
        renderTracePanel(
          div,
          options.trace,
          Boolean(options.traceActive),
          options.statusMessage || "",
        );
      }
      if (!isStatus && role === "assistant") {
        renderUsagePanel(div, options.usage || {}, Boolean(options.usageActive));
      }
      if (
        !isStatus &&
        options.showActions !== false &&
        Number.isInteger(options.messageIndex)
      ) {
        addMessageActions(div, options.messageIndex);
      }
      messagesEl.appendChild(div);
      if (options.followIfNearBottom && wasNearBottom) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      return c;
    }

    function formatBytes(value) {
      const bytes = Number(value) || 0;
      if (bytes < 1024) return bytes + "B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + "KB";
      return (bytes / 1024 / 1024).toFixed(1) + "MB";
    }

    function setAttachmentStatus(message, bad = false) {
      const status = $("attachment-status");
      status.textContent = message || "";
      status.className = "attachment-status" + (bad ? " bad" : "");
    }

    function renderAttachments() {
      const tray = $("attachment-tray");
      tray.innerHTML = "";
      tray.classList.toggle("visible", pendingAttachments.length > 0);
      for (const item of pendingAttachments) {
        const chip = document.createElement("div");
        chip.className = "attachment-chip";
        const icon = item.kind === "image" ? "🖼️" : "📄";
        chip.innerHTML =
          '<span aria-hidden="true">' + icon + '</span>' +
          '<span class="attachment-name"></span>' +
          '<span>' + formatBytes(item.size) + '</span>' +
          '<button class="attachment-remove" type="button" title="移除附件" aria-label="移除附件">×</button>';
        chip.querySelector(".attachment-name").textContent = item.name;
        chip.querySelector(".attachment-remove").onclick = async () => {
          if (busy || uploadingAttachments) return;
          try {
            await api("/api/attachments/" + encodeURIComponent(item.id), {
              method: "DELETE",
            });
          } catch (_) {}
          pendingAttachments = pendingAttachments.filter(
            (attachment) => attachment.id !== item.id,
          );
          renderAttachments();
        };
        tray.appendChild(chip);
      }
    }

    async function loadPendingAttachments() {
      pendingAttachments = [];
      renderAttachments();
      if (!currentConversationId) return;
      try {
        const res = await api(
          "/api/attachments?conversation_id=" +
          encodeURIComponent(currentConversationId),
        );
        if (!res.ok) return;
        const payload = await res.json();
        pendingAttachments = payload.data || [];
        renderAttachments();
      } catch (_) {}
    }

    async function uploadOneAttachment(file) {
      const params = new URLSearchParams({
        conversation_id: currentConversationId,
        filename: file.name || "attachment",
      });
      const headers = {};
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      headers["Content-Type"] = file.type || "application/octet-stream";
      const res = await fetch("/api/attachments?" + params.toString(), {
        method: "POST",
        cache: "no-store",
        headers,
        body: file,
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.detail || "附件上传失败");
      return payload;
    }

    $("attach-btn").onclick = () => {
      if (!busy && !uploadingAttachments) $("file-input").click();
    };
    $("file-input").addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (!files.length) return;
      if (pendingAttachments.length + files.length > MAX_ATTACHMENT_FILES) {
        setAttachmentStatus("一次消息最多上传 10 个附件。", true);
        return;
      }
      const currentBytes = pendingAttachments.reduce(
        (sum, item) => sum + (Number(item.size) || 0),
        0,
      );
      const newBytes = files.reduce((sum, file) => sum + file.size, 0);
      if (files.some((file) => file.size > MAX_ATTACHMENT_BYTES) ||
          currentBytes + newBytes > MAX_ATTACHMENT_BYTES) {
        setAttachmentStatus("一次消息的附件总量不能超过 50MB。", true);
        return;
      }

      uploadingAttachments = true;
      $("attach-btn").disabled = true;
      $("send-btn").disabled = true;
      try {
        for (let index = 0; index < files.length; index++) {
          setAttachmentStatus(
            "正在处理附件 " + (index + 1) + "/" + files.length + "：" + files[index].name,
          );
          const uploaded = await uploadOneAttachment(files[index]);
          pendingAttachments.push(uploaded);
          renderAttachments();
        }
        setAttachmentStatus(
          "附件已就绪。图片会压缩后发送，文档只提取有限文字。",
        );
      } catch (error) {
        setAttachmentStatus(error.message, true);
      } finally {
        uploadingAttachments = false;
        $("attach-btn").disabled = busy;
        $("send-btn").disabled = busy;
      }
    });

    function autoResize() {
      const ta = $("input");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }
    $("input").addEventListener("input", autoResize);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    $("send-btn").onclick = send;
    $("stop-btn").onclick = stopGeneration;

    function setBusyState(value) {
      busy = value;
      $("send-btn").disabled = value;
      $("attach-btn").disabled = value;
      $("file-input").disabled = value;
      $("model-select").disabled = value;
      $("reasoning-depth").disabled = value;
      $("conversation-select").disabled = value;
      $("history-prev").disabled = value || conversationPage <= 1;
      $("history-next").disabled =
        value || conversationPage >= conversationTotalPages;
      $("new-chat-btn").disabled = value;
      $("delete-chat-btn").disabled = value;
      $("clear-btn").disabled = value;
      $("settings-btn").disabled = value;
      $("admin-btn").disabled = value;
      $("stop-btn").style.display = value ? "" : "none";
      $("stop-btn").disabled = false;
    }

    function clearJobPoll() {
      if (jobPollTimer) clearTimeout(jobPollTimer);
      jobPollTimer = null;
    }

    function showJobInConversation(job) {
      const item = conversations.find((entry) => entry.id === job.conversation_id);
      if (item) {
        currentConversationId = item.id;
        history = (item.messages || []).map((message) => ({
          role: message.role,
          content: message.content || "",
          trace: Array.isArray(message.trace) ? message.trace : [],
          usage: message.usage && typeof message.usage === "object"
            ? message.usage : {},
        }));
        renderConversationSelect();
        renderConversation();
      }
      const contentEl = appendMsg(
        "assistant",
        job.content || "",
        false,
        {
          showActions: false,
          trace: job.trace || [],
          traceActive: true,
          statusMessage: job.status_message || "后台生成中…",
          usage: job.usage || {},
          usageActive: true,
        },
      );
      return { contentEl };
    }

    async function resumeActiveJob() {
      try {
        const res = await api("/api/chat/jobs/active");
        if (!res.ok) return;
        const payload = await res.json();
        if (!payload.job) return;
        await loadConversationDetail(payload.job.conversation_id);
        currentJobId = payload.job.id;
        setBusyState(true);
        const ui = showJobInConversation(payload.job);
        pollJob(payload.job.id, ui.contentEl, true);
      } catch (_) {}
    }

    async function pollJob(jobId, contentEl, immediate = false) {
      clearJobPoll();
      const poll = async () => {
        if (currentJobId !== jobId) return;
        try {
          const res = await api("/api/chat/jobs/" + encodeURIComponent(jobId));
          if (res.status === 401) {
            clearAuth();
            location.reload();
            return;
          }
          if (!res.ok) throw new Error("任务状态读取失败");
          const job = await res.json();
          const active = ["queued", "running", "stopping"].includes(job.status);
          setAssistantContent(contentEl, job.content || "");
          renderTracePanel(
            contentEl.closest(".msg"),
            job.trace || [],
            active,
            job.status_message || (
              job.status === "stopping" ? "正在停止…" : "后台生成中…"
            ),
          );
          renderUsagePanel(
            contentEl.closest(".msg"),
            job.usage || {},
            active,
          );
          if (active) {
            jobPollTimer = setTimeout(poll, 900);
            return;
          }
          const finalContent = job.content || "(无内容)";
          setAssistantContent(contentEl, finalContent);
          const last = history[history.length - 1];
          if (!last || last.role !== "assistant") {
            history.push({
              role: "assistant",
              content: finalContent,
              trace: job.trace || [],
              usage: job.usage || {},
            });
          } else {
            last.content = finalContent;
            last.trace = job.trace || [];
            last.usage = job.usage || {};
          }
          addMessageActions(
            contentEl.closest(".msg"),
            history.length - 1,
          );
          const conversation = conversations.find(
            (entry) => entry.id === currentConversationId,
          );
          if (conversation) {
            conversation.title = currentTitle();
            conversation.messages = history.map((message) => ({
              role: message.role,
              content: message.content,
              trace: Array.isArray(message.trace) ? message.trace : [],
              usage: message.usage && typeof message.usage === "object"
                ? message.usage : {},
            }));
            conversation.updated_at = new Date().toISOString();
            conversations = [
              conversation,
              ...conversations.filter((entry) => entry.id !== conversation.id),
            ].slice(0, 10);
            renderConversationSelect();
          }
          currentJobId = "";
          clearJobPoll();
          setBusyState(false);
        } catch (_) {
          // 页面离线或锁屏时不影响服务器任务；恢复联网后继续查询。
          if (currentJobId === jobId) jobPollTimer = setTimeout(poll, 1800);
        }
      };
      jobPollTimer = setTimeout(poll, immediate ? 0 : 700);
    }

    async function stopGeneration() {
      if (!currentJobId) return;
      $("stop-btn").disabled = true;
      try {
        await api(
          "/api/chat/jobs/" + encodeURIComponent(currentJobId) + "/stop",
          { method: "POST" },
        );
      } catch (_) {
        $("stop-btn").disabled = false;
      }
    }

    async function startAssistantGeneration(attachmentIds = []) {
      setBusyState(true);
      await persistConversation();

      const contentEl = appendMsg(
        "assistant",
        "",
        false,
        {
          showActions: false,
          trace: [],
          traceActive: true,
          statusMessage: "正在提交后台任务…",
        },
      );
      try {
        const res = await api("/api/chat/jobs", {
          method: "POST",
          body: JSON.stringify({
            model: $("model-select").value || null,
            reasoning_depth: $("reasoning-depth").value || "deep",
            messages: history.map((m) => ({
              role: m.role,
              content: m.content,
              trace: Array.isArray(m.trace) ? m.trace : [],
              usage: m.usage && typeof m.usage === "object" ? m.usage : {},
            })),
            conversation_id: currentConversationId,
            title: currentTitle(),
            attachment_ids: attachmentIds,
          }),
        });
        if (res.status === 401) {
          clearAuth();
          location.reload();
          return false;
        }
        const job = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(job.detail || "后台任务提交失败");
        currentJobId = job.id;
        renderTracePanel(
          contentEl.closest(".msg"),
          job.trace || [],
          true,
          job.status_message || "后台生成中…",
        );
        pollJob(job.id, contentEl, true);
        return true;
      } catch (e) {
        renderTracePanel(contentEl.closest(".msg"), [], false, "");
        setAssistantContent(contentEl, "请求失败：" + e.message);
        setBusyState(false);
        return false;
      }
    }

    async function retryMessage(messageIndex) {
      if (busy || !history[messageIndex]) return;
      let userIndex = messageIndex;
      if (history[messageIndex].role !== "user") {
        userIndex = -1;
        for (let index = messageIndex - 1; index >= 0; index--) {
          if (history[index].role === "user") {
            userIndex = index;
            break;
          }
        }
      }
      if (userIndex < 0) return;
      const previousScrollTop = $("messages").scrollTop;
      history = history.slice(0, userIndex + 1);
      renderConversation();
      $("messages").scrollTop = Math.min(
        previousScrollTop,
        Math.max(0, $("messages").scrollHeight - $("messages").clientHeight),
      );
      await startAssistantGeneration();
    }

    async function send() {
      if (busy || uploadingAttachments) return;
      const text = $("input").value.trim();
      if (!text && !pendingAttachments.length) return;
      const attachmentIds = pendingAttachments.map((item) => item.id);
      const attachmentSummary = pendingAttachments.length
        ? "\n\n" + pendingAttachments.map(
            (item) => "📎 " + item.name + "（" + formatBytes(item.size) + "）",
          ).join("\n")
        : "";
      const displayText = (text || "请分析这些附件。") + attachmentSummary;
      $("input").value = "";
      autoResize();

      history.push({ role: "user", content: displayText });
      appendMsg("user", displayText, false, {
        messageIndex: history.length - 1,
        showActions: true,
        followIfNearBottom: true,
      });
      const started = await startAssistantGeneration(attachmentIds);
      if (started) {
        pendingAttachments = [];
        renderAttachments();
        setAttachmentStatus("");
      }
    }

    init();
  </script>
</body>
</html>
