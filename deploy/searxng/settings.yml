use_default_settings: true

general:
  instance_name: "Lite AI Chat Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "CHANGE_ME_AT_INSTALL"
  limiter: false
  image_proxy: false
  bind_address: "127.0.0.1"
  port: 8888

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 12
  pool_maxsize: 8

# 应用请求会显式传入 engines=，只聚合以下三个可配置上游。
engines:
  - name: bing
    disabled: false
    base_url: "https://www.bing.com"
  - name: wikipedia
    disabled: false
  - name: google cse
    disabled: false

  # 旧安装曾显式启用这些引擎；明确恢复为关闭，避免直接访问
  # SearXNG general 分类时再次同时请求它们。
  - name: google
    disabled: true
  - name: baidu
    disabled: true
  - name: sogou
    disabled: true
  - name: 360search
    disabled: true
  - name: currency
    disabled: true
  - name: wikidata
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: lingva
    disabled: true
  - name: startpage
    disabled: true
  - name: dictzone
    disabled: true
  - name: mymemory translated
    disabled: true
  - name: brave
    disabled: true
